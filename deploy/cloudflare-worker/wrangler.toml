# wrangler.toml — Cloudflare Worker config for the tinyassets.io/mcp
# path-based router.
#
# Deploy targets:
#   zone: tinyassets.io
#   route: tinyassets.io/mcp*  (canonical /mcp proxy plus retired-path guard)
#
# Reference: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "tinyassets-mcp-proxy"
main = "worker.js"

# Pin the compat date so upstream runtime changes don't silently alter
# behavior. Bump this knowingly when a new Worker feature is needed.
compatibility_date = "2025-10-01"

# nodejs_compat isn't needed for this Worker — we only use the Fetch
# API + URL + Headers + Response primitives. Keeping it off keeps the
# bundle small + avoids tree-shake surprises.
compatibility_flags = []

# Route — deliberately matches any request whose path starts with /mcp.
# worker.js proxies only canonical /mcp and returns the same ordinary 404 for
# every retired /mcp-directory* variant. Narrowing this binding would leak
# stale calls to the website origin and make rejection method-dependent.
# Cloudflare route syntax uses `*` as a match-any suffix.
# Zone name must match the Cloudflare zone that owns tinyassets.io.
routes = [
    { pattern = "tinyassets.io/mcp*", zone_name = "tinyassets.io" },
]

# Observability — enable request logs so post-P0 debugging has a trail.
# Tail via `wrangler tail`. Costs negligible at our request volume.
[observability]
enabled = true
head_sampling_rate = 1.0

# No bindings (KV, D1, Queues) — this Worker is a pure proxy.
# Secrets (set via dashboard or wrangler secret put, NOT committed here):
#   CF_ACCESS_CLIENT_ID     — CF Access service-token client ID
#   CF_ACCESS_CLIENT_SECRET — CF Access service-token client secret
# These let the Worker reach the Access-gated mcp.tinyassets.io tunnel origin.

# Local dev:
#   wrangler dev --local
# Deploy:
#   wrangler login
#   wrangler deploy
# Tail logs:
#   wrangler tail
