name: Install host services

on:
  workflow_run:
    workflows: ["Deploy prod"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_backup:
        description: Run and verify a fresh production backup after installation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-host-mutation
  cancel-in-progress: false

env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}

jobs:
  install:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify secrets present
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          missing=()
          [ -z "$DO_DROPLET_HOST" ] && missing+=("DO_DROPLET_HOST")
          [ -z "$DO_SSH_USER" ] && missing+=("DO_SSH_USER")
          [ -z "${{ secrets.DO_SSH_KEY }}" ] && missing+=("DO_SSH_KEY")
          [ -z "$DO_API_TOKEN" ] && missing+=("DO_API_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Refuse host mutation during stop-writer cutover
        run: |
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              scripts/retire_cheat_loop_deploy_fence.py \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:/tmp/retire-cheat-loop-deploy-fence.py"
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo python3 /tmp/retire-cheat-loop-deploy-fence.py --state-path /var/lib/tinyassets-deploy/retire-cheat-loop-task-2-1-fence.json guard-host-mutation"

      - name: Ensure off-host backup configuration
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          set -euo pipefail
          # This external Space predates the product rename and cannot be renamed.
          destination="spaces:workflow-backups-jonnyton-sfo3/workflow-backups"
          bucket="workflow-backups-jonnyton-sfo3"
          endpoint="sfo3.digitaloceanspaces.com"
          key_name="tinyassets-backup-shipper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          remote_state="$(
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "sudo bash -s -- $(printf '%q' "${destination}")" <<'BACKUP_STATE'
          set -euo pipefail
          expected_destination="$1"
          env_file="${2:-/etc/tinyassets/env}"
          config="${3:-/root/.config/rclone/rclone.conf}"
          rclone_bin="${4:-rclone}"
          expected_config_identity="${5:-root:root 600}"
          assignment_count="$(
            awk -F= '$1 == "BACKUP_DEST" { count++ } END { print count + 0 }' \
              "${env_file}" 2>/dev/null || printf '0\n'
          )"
          configured_destination="$(
            awk -F= '
              $1 == "BACKUP_DEST" {
                value = substr($0, index($0, "=") + 1)
              }
              END { print value }
            ' "${env_file}" 2>/dev/null || true
          )"
          config_identity="$(stat -c '%U:%G %a' "${config}" 2>/dev/null || true)"
          if [[ "${assignment_count}" == "1" &&
            "${configured_destination}" == "${expected_destination}" &&
            -f "${config}" && ! -L "${config}" &&
            "${config_identity}" == "${expected_config_identity}"
          ]]; then
            if "${rclone_bin}" lsf "${expected_destination}" --max-depth 1 >/dev/null 2>&1; then
              printf 'configured_ready\n'
            else
              printf 'partial_or_invalid\n'
            fi
          elif [[ "${assignment_count}" == "0" &&
            ! -e "${config}" && ! -L "${config}"
          ]]; then
            printf 'completely_absent\n'
          else
            printf 'partial_or_invalid\n'
          fi
          BACKUP_STATE
          )"

          case "${remote_state}" in
            configured_ready)
              echo "Off-host backup configuration is already verified."
              exit 0
              ;;
            completely_absent)
              echo "Off-host backup configuration is absent; converging it."
              ;;
            partial_or_invalid)
              echo "::error::Off-host backup configuration is partial or its destination probe failed; refusing automatic rotation."
              exit 1
              ;;
            *)
              echo "::error::Unexpected backup configuration state."
              exit 1
              ;;
          esac

          response_file="$(mktemp)"
          credentials_file="$(mktemp)"
          rclone_file="$(mktemp)"
          api_header_file="$(mktemp)"
          chmod 600 \
            "${response_file}" "${credentials_file}" "${rclone_file}" \
            "${api_header_file}"
          printf 'Authorization: Bearer %s\n' "${DO_API_TOKEN}" \
            > "${api_header_file}"
          remote_stage=""
          created_access_key=""
          cleanup() {
            rc=$?
            cleanup_failed=0
            set +e
            if [[ "${rc}" -ne 0 && -n "${created_access_key}" ]]; then
              if [[ -n "${remote_stage}" ]]; then
                rollback_command="rm -f /root/.config/rclone/rclone.conf; bash $(printf '%q' "${remote_stage}/install-tinyassets-env.sh") delete BACKUP_DEST"
                if ! ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                    "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                    "sudo python3 /tmp/retire-cheat-loop-deploy-fence.py guard-host-mutation --command-timeout 120 -- /bin/bash -lc $(printf '%q' "${rollback_command}")" \
                    >/dev/null 2>&1
                then
                  echo "::error::Remote backup configuration rollback failed."
                  cleanup_failed=1
                fi
              fi
              delete_http_status="$(
                curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                  -H @"${api_header_file}" \
                  "https://api.digitalocean.com/v2/spaces/keys/${created_access_key}"
              )"
              delete_transport_rc=$?
              if [[ "${delete_transport_rc}" -ne 0 ]]; then
                echo "::error::Spaces key rollback failed with a transport error."
                cleanup_failed=1
              elif [[ "${delete_http_status}" != "204" ]]; then
                echo "::error::Spaces key rollback failed with HTTP ${delete_http_status}."
                cleanup_failed=1
              else
                echo "Rolled back the newly created Spaces key."
              fi
            fi
            if [[ -n "${remote_stage}" ]]; then
              ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                  "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                  "rm -rf -- $(printf '%q' "${remote_stage}")" \
                  >/dev/null 2>&1 || true
            fi
            rm -f -- \
              "${response_file}" "${credentials_file}" "${rclone_file}" \
              "${api_header_file}"
            if [[ "${cleanup_failed}" -ne 0 ]]; then
              exit 1
            fi
            exit "${rc}"
          }
          trap cleanup EXIT

          payload="$(
            printf '{"name":"%s","grants":[{"bucket":"%s","permission":"readwrite"}]}' \
              "${key_name}" "${bucket}"
          )"
          http_status="$(
            curl -sS --max-filesize 4096 \
              -o "${response_file}" -w '%{http_code}' -X POST \
              -H @"${api_header_file}" \
              -H "Content-Type: application/json" \
              --data-binary "${payload}" \
              "https://api.digitalocean.com/v2/spaces/keys"
          )"
          if [[ "${http_status}" != "201" ]]; then
            provider_error="$(
              python - "${response_file}" <<'DIAGNOSTIC_PY'
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError):
              print("unparseable provider error")
              raise SystemExit
          if not isinstance(payload, dict):
              print("malformed provider error")
              raise SystemExit
          error_id = payload.get("id")
          message = payload.get("message")
          if not isinstance(error_id, str) or not isinstance(message, str):
              print("malformed provider error")
              raise SystemExit
          known_ids = {
              "bad_request",
              "forbidden",
              "not_found",
              "server_error",
              "too_many_requests",
              "unauthorized",
          }
          safe_id = error_id if error_id in known_ids else "redacted"
          normalized = re.sub(r"[\x00-\x1f\x7f]+", " ", message).lower()
          if any(
              term in normalized
              for term in (
                  "scope",
                  "permission",
                  "authorization",
                  "unauthorized",
                  "forbidden",
                  "credential",
                  "token",
              )
          ):
              category = "authorization_or_scope"
          elif any(term in normalized for term in ("bucket", "grant")):
              category = "bucket_or_grant"
          else:
              category = "other"
          print(f"id={safe_id} category={category}")
          DIAGNOSTIC_PY
            )"
            echo "::error::DigitalOcean Spaces key creation failed with HTTP ${http_status} (${provider_error})."
            exit 1
          fi

          python - "${response_file}" > "${credentials_file}" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          key = payload.get("key")
          if not isinstance(key, dict):
              raise SystemExit("Spaces key response omitted key")
          access_key = key.get("access_key")
          secret_key = key.get("secret_key")
          if not isinstance(access_key, str) or not re.fullmatch(r"[A-Za-z0-9]{8,128}", access_key):
              raise SystemExit("Spaces key response contained invalid access key")
          if not isinstance(secret_key, str) or not re.fullmatch(r"[A-Za-z0-9+/=_-]{16,256}", secret_key):
              raise SystemExit("Spaces key response contained invalid secret key")
          print(access_key)
          print(secret_key)
          PY
          mapfile -t credentials < "${credentials_file}"
          [[ "${#credentials[@]}" -eq 2 ]]
          created_access_key="${credentials[0]}"
          secret_key="${credentials[1]}"
          echo "::add-mask::${created_access_key}"
          echo "::add-mask::${secret_key}"

          printf '%s\n' \
            '[spaces]' \
            'type = s3' \
            'provider = DigitalOcean' \
            "access_key_id = ${created_access_key}" \
            "secret_access_key = ${secret_key}" \
            "endpoint = ${endpoint}" \
            'acl = private' \
            > "${rclone_file}"

          remote_stage="$(
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "mktemp -d /tmp/tinyassets-backup-config.XXXXXX"
          )"
          [[ "${remote_stage}" =~ ^/tmp/tinyassets-backup-config[.][A-Za-z0-9]+$ ]]
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${rclone_file}" \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:${remote_stage}/rclone.conf"
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              deploy/install-tinyassets-env.sh \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:${remote_stage}/"

          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo python3 /tmp/retire-cheat-loop-deploy-fence.py guard-host-mutation --command-timeout 300 -- /bin/bash -se -- $(printf '%q' "${remote_stage}") $(printf '%q' "${destination}")" <<'BACKUP_REMOTE'
          set -euo pipefail
          remote_stage="$1"
          destination="$2"
          sudo install -d -m 0700 -o root -g root /root/.config/rclone
          sudo install -m 0600 -o root -g root \
              "${remote_stage}/rclone.conf" \
              /root/.config/rclone/rclone.conf
          printf '%s\n' "${destination}" \
            | sudo bash "${remote_stage}/install-tinyassets-env.sh" set BACKUP_DEST
          probe_ready=0
          for delay in 0 5 10 20 30; do
            if [[ "${delay}" -gt 0 ]]; then
              sleep "${delay}"
            fi
            if timeout --kill-after=1s 5s sudo rclone lsf "${destination}" --max-depth 1 --retries 1 --low-level-retries 1 >/dev/null 2>&1; then
              probe_ready=1
              break
            fi
          done
          if [[ "${probe_ready}" -ne 1 ]]; then
            echo "Spaces key did not become usable within the propagation window." >&2
            exit 1
          fi
          BACKUP_REMOTE
          echo "Off-host backup configuration installed and verified."

      # Off-REGION copy of both backup tiers (target-architecture S1a.3; concern
      # 2026-10-02-backups-share-the-droplets-region). BACKUP_DEST is a Spaces
      # bucket in sfo3, the droplet's own region, so a regional loss takes the
      # primary and its only off-host copy together. This converges a second
      # bucket in nyc3 (same provider, $0 extra on the existing Spaces plan; the
      # provider-diverse upgrade is R2 at the first paying users) and a
      # per-bucket readwrite key for it, as an `[offregion]` rclone remote
      # beside `[spaces]`.
      #
      # Bucket creation needs a key that is not scoped to a bucket that does not
      # exist yet, so a `fullaccess` key is minted ONLY when the remote is
      # absent, used for one `rclone mkdir` on the runner, and deleted (HTTP 204
      # required) before anything touches the droplet. The droplet only ever
      # holds the per-bucket readwrite key. The weekly DR drill mints its own
      # short-lived read key per run, so no standing read credential exists.
      - name: Ensure off-region backup configuration
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          set -euo pipefail
          bucket="tinyassets-offregion"
          endpoint="nyc3.digitaloceanspaces.com"
          destination="offregion:${bucket}/backups"
          bootstrap_key_name="tinyassets-offregion-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_name="tinyassets-offregion-shipper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          remote_state="$(
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "sudo bash -s -- $(printf '%q' "${destination}")" <<'OFFREGION_STATE'
          set -euo pipefail
          expected_destination="$1"
          env_file="${2:-/etc/tinyassets/env}"
          config="${3:-/root/.config/rclone/rclone.conf}"
          rclone_bin="${4:-rclone}"
          assignment_count="$(
            awk -F= '$1 == "BACKUP_OFFREGION_DEST" { count++ } END { print count + 0 }' \
              "${env_file}" 2>/dev/null || printf '0\n'
          )"
          configured_destination="$(
            awk -F= '
              $1 == "BACKUP_OFFREGION_DEST" {
                value = substr($0, index($0, "=") + 1)
              }
              END { print value }
            ' "${env_file}" 2>/dev/null || true
          )"
          section_count="$(grep -c '^\[offregion\]$' "${config}" 2>/dev/null || true)"
          section_count="${section_count:-0}"
          if [[ "${assignment_count}" == "1" &&
            "${configured_destination}" == "${expected_destination}" &&
            "${section_count}" == "1" && ! -L "${config}"
          ]]; then
            if "${rclone_bin}" lsf "${expected_destination}" --max-depth 1 >/dev/null 2>&1; then
              printf 'configured_ready\n'
            else
              printf 'partial_or_invalid\n'
            fi
          elif [[ "${assignment_count}" == "0" && "${section_count}" == "0" ]]; then
            printf 'completely_absent\n'
          else
            printf 'partial_or_invalid\n'
          fi
          OFFREGION_STATE
          )"

          case "${remote_state}" in
            configured_ready)
              echo "Off-region backup configuration is already verified."
              exit 0
              ;;
            completely_absent)
              echo "Off-region backup configuration is absent; converging it."
              ;;
            partial_or_invalid)
              echo "::error::Off-region backup configuration is partial or its destination probe failed; refusing automatic rotation."
              exit 1
              ;;
            *)
              echo "::error::Unexpected off-region backup configuration state."
              exit 1
              ;;
          esac

          sudo apt-get install -y --no-install-recommends rclone >/dev/null
          response_file="$(mktemp)"
          credentials_file="$(mktemp)"
          section_file="$(mktemp)"
          api_header_file="$(mktemp)"
          chmod 600 \
            "${response_file}" "${credentials_file}" "${section_file}" \
            "${api_header_file}"
          printf 'Authorization: Bearer %s\n' "${DO_API_TOKEN}" \
            > "${api_header_file}"
          remote_stage=""
          bootstrap_access_key=""
          created_access_key=""

          delete_key() {
            # $1 = access key id; prints nothing secret; returns non-zero unless 204.
            local status rc
            status="$(
              curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H @"${api_header_file}" \
                "https://api.digitalocean.com/v2/spaces/keys/$1"
            )"
            rc=$?
            [[ "${rc}" -eq 0 && "${status}" == "204" ]]
          }

          cleanup() {
            rc=$?
            cleanup_failed=0
            set +e
            if [[ -n "${bootstrap_access_key}" ]]; then
              if ! delete_key "${bootstrap_access_key}"; then
                echo "::error::Bootstrap fullaccess Spaces key deletion failed; delete key ${bootstrap_key_name} in the DO console."
                cleanup_failed=1
              fi
            fi
            if [[ "${rc}" -ne 0 && -n "${created_access_key}" ]]; then
              if [[ -n "${remote_stage}" ]]; then
                rollback_command="python3 $(printf '%q' "${remote_stage}/rclone_conf_section.py") remove /root/.config/rclone/rclone.conf offregion; bash $(printf '%q' "${remote_stage}/install-tinyassets-env.sh") delete BACKUP_OFFREGION_DEST"
                if ! ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                    "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                    "sudo python3 /tmp/retire-cheat-loop-deploy-fence.py guard-host-mutation --command-timeout 120 -- /bin/bash -lc $(printf '%q' "${rollback_command}")" \
                    >/dev/null 2>&1
                then
                  echo "::error::Remote off-region configuration rollback failed."
                  cleanup_failed=1
                fi
              fi
              if delete_key "${created_access_key}"; then
                echo "Rolled back the newly created off-region Spaces key."
              else
                echo "::error::Off-region Spaces key rollback failed."
                cleanup_failed=1
              fi
            fi
            if [[ -n "${remote_stage}" ]]; then
              ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                  "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                  "rm -rf -- $(printf '%q' "${remote_stage}")" \
                  >/dev/null 2>&1 || true
            fi
            rm -f -- \
              "${response_file}" "${credentials_file}" "${section_file}" \
              "${api_header_file}"
            if [[ "${cleanup_failed}" -ne 0 ]]; then
              exit 1
            fi
            exit "${rc}"
          }
          trap cleanup EXIT

          mint_key() {
            # $1 = JSON payload. Writes "access\nsecret" to credentials_file.
            local http_status
            http_status="$(
              curl -sS --max-filesize 4096 \
                -o "${response_file}" -w '%{http_code}' -X POST \
                -H @"${api_header_file}" \
                -H "Content-Type: application/json" \
                --data-binary "$1" \
                "https://api.digitalocean.com/v2/spaces/keys"
            )"
            if [[ "${http_status}" != "201" ]]; then
              echo "::error::DigitalOcean Spaces key creation failed with HTTP ${http_status}; check DO_API_TOKEN has the spaces key scopes."
              return 1
            fi
            python - "${response_file}" > "${credentials_file}" <<'OFFREGION_KEY_PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          key = payload.get("key")
          if not isinstance(key, dict):
              raise SystemExit("Spaces key response omitted key")
          access_key = key.get("access_key")
          secret_key = key.get("secret_key")
          if not isinstance(access_key, str) or not re.fullmatch(r"[A-Za-z0-9]{8,128}", access_key):
              raise SystemExit("Spaces key response contained invalid access key")
          if not isinstance(secret_key, str) or not re.fullmatch(r"[A-Za-z0-9+/=_-]{16,256}", secret_key):
              raise SystemExit("Spaces key response contained invalid secret key")
          print(access_key)
          print(secret_key)
          OFFREGION_KEY_PY
          }

          # 1. Bucket: a short-lived fullaccess key, used once on the runner.
          mint_key "$(printf '{"name":"%s","grants":[{"bucket":"","permission":"fullaccess"}]}' "${bootstrap_key_name}")"
          mapfile -t credentials < "${credentials_file}"
          [[ "${#credentials[@]}" -eq 2 ]]
          bootstrap_access_key="${credentials[0]}"
          echo "::add-mask::${credentials[0]}"
          echo "::add-mask::${credentials[1]}"
          bucket_ready=0
          for delay in 0 5 10 20 30; do
            if [[ "${delay}" -gt 0 ]]; then
              sleep "${delay}"
            fi
            if RCLONE_CONFIG_BOOT_TYPE=s3 RCLONE_CONFIG_BOOT_PROVIDER=DigitalOcean \
                RCLONE_CONFIG_BOOT_ACCESS_KEY_ID="${credentials[0]}" \
                RCLONE_CONFIG_BOOT_SECRET_ACCESS_KEY="${credentials[1]}" \
                RCLONE_CONFIG_BOOT_ENDPOINT="${endpoint}" RCLONE_CONFIG_BOOT_ACL=private \
                timeout --kill-after=1s 30s rclone mkdir "boot:${bucket}" --retries 1 --low-level-retries 1 \
                >/dev/null 2>&1; then
              bucket_ready=1
              break
            fi
          done
          if [[ "${bucket_ready}" -ne 1 ]]; then
            echo "::error::Could not create or reach bucket ${bucket} in nyc3 (name taken by another account, or key propagation)."
            exit 1
          fi
          if ! delete_key "${bootstrap_access_key}"; then
            echo "::error::Bootstrap fullaccess Spaces key deletion failed."
            exit 1
          fi
          bootstrap_access_key=""
          echo "Bucket ${bucket} (nyc3) ready; bootstrap key deleted."

          # 2. The droplet's per-bucket readwrite key.
          mint_key "$(printf '{"name":"%s","grants":[{"bucket":"%s","permission":"readwrite"}]}' "${key_name}" "${bucket}")"
          mapfile -t credentials < "${credentials_file}"
          [[ "${#credentials[@]}" -eq 2 ]]
          created_access_key="${credentials[0]}"
          secret_key="${credentials[1]}"
          echo "::add-mask::${created_access_key}"
          echo "::add-mask::${secret_key}"
          printf '%s\n' \
            '[offregion]' \
            'type = s3' \
            'provider = DigitalOcean' \
            "access_key_id = ${created_access_key}" \
            "secret_access_key = ${secret_key}" \
            "endpoint = ${endpoint}" \
            'acl = private' \
            > "${section_file}"

          remote_stage="$(
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "mktemp -d /tmp/tinyassets-offregion-config.XXXXXX"
          )"
          [[ "${remote_stage}" =~ ^/tmp/tinyassets-offregion-config[.][A-Za-z0-9]+$ ]]
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${section_file}" \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:${remote_stage}/offregion.section"
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              deploy/install-tinyassets-env.sh scripts/rclone_conf_section.py \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:${remote_stage}/"

          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo python3 /tmp/retire-cheat-loop-deploy-fence.py guard-host-mutation --command-timeout 300 -- /bin/bash -se -- $(printf '%q' "${remote_stage}") $(printf '%q' "${destination}")" <<'OFFREGION_REMOTE'
          set -euo pipefail
          remote_stage="$1"
          destination="$2"
          sudo install -d -m 0700 -o root -g root /root/.config/rclone
          sudo python3 "${remote_stage}/rclone_conf_section.py" add \
              /root/.config/rclone/rclone.conf "${remote_stage}/offregion.section"
          printf '%s\n' "${destination}" \
            | sudo bash "${remote_stage}/install-tinyassets-env.sh" set BACKUP_OFFREGION_DEST
          probe_ready=0
          for delay in 0 5 10 20 30; do
            if [[ "${delay}" -gt 0 ]]; then
              sleep "${delay}"
            fi
            if timeout --kill-after=1s 5s sudo rclone lsf "${destination}" --max-depth 1 --retries 1 --low-level-retries 1 >/dev/null 2>&1; then
              probe_ready=1
              break
            fi
          done
          if [[ "${probe_ready}" -ne 1 ]]; then
            echo "Off-region Spaces key did not become usable within the propagation window." >&2
            exit 1
          fi
          OFFREGION_REMOTE
          echo "Off-region backup configuration installed and verified."

      - name: Install exact uptime bundle
        env:
          REQUESTED_SOURCE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${source_sha}" == "${REQUESTED_SOURCE_REF}" ]]
          echo "Resolved requested source ${REQUESTED_SOURCE_REF} to ${source_sha}"
          bundle="/tmp/tinyassets-host-uptime-${source_sha}.tar.gz"
          checksum="${bundle}.sha256"
          mapfile -t uptime_files < <(
            TINYASSETS_PRINT_MANIFEST=1 \
              bash deploy/install-host-uptime-services.sh
          )
          git archive --format=tar HEAD -- \
              "${uptime_files[@]}" \
              | gzip -n > "${bundle}"
          (
            cd /tmp
            sha256sum "$(basename "${bundle}")" > "$(basename "${checksum}")"
          )

          remote_stage="$(
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "mktemp -d /tmp/tinyassets-host-uptime.XXXXXX"
          )"
          [[ "${remote_stage}" =~ ^/tmp/tinyassets-host-uptime[.][A-Za-z0-9]+$ ]]
          cleanup() {
            ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
                "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
                "rm -rf -- '${remote_stage}'" || true
          }
          trap cleanup EXIT
          scp -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${bundle}" "${checksum}" \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}:${remote_stage}/"

          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "sudo python3 /tmp/retire-cheat-loop-deploy-fence.py guard-host-mutation --command-timeout 300 -- /bin/bash -se -- $(printf '%q' "${remote_stage}") $(printf '%q' "${source_sha}") $(printf '%q' "$(basename "${bundle}")") $(printf '%q' "$(basename "${checksum}")")" <<'REMOTE'
          set -euo pipefail
          remote_stage="$1"
          source_sha="$2"
          bundle_name="$3"
          checksum_name="$4"
          cd "${remote_stage}"
          sha256sum -c "${checksum_name}"
          mkdir source
          tar -xzf "${bundle_name}" -C source
          sudo env TINYASSETS_SOURCE_ROOT="${remote_stage}/source" \
              TINYASSETS_SOURCE_SHA="${source_sha}" \
              bash "${remote_stage}/source/deploy/install-host-uptime-services.sh"
          REMOTE

      - name: Exercise and verify two-tier backup
        if: github.event_name == 'workflow_dispatch' && inputs.run_backup
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "bash -se" <<'BACKUP_EXERCISE'
          set -euo pipefail
          destination="spaces:workflow-backups-jonnyton-sfo3/workflow-backups"

          latest_archive() {
            prefix="$1"
            sudo rclone lsf "${destination}/" --max-depth 1 --files-only 2>/dev/null \
              | awk -v prefix="${prefix}" 'index($0, prefix) == 1 { print }' \
              | sort \
              | tail -n 1
          }

          before_brain="$(latest_archive "tinyassets-brain-")"
          before_full="$(latest_archive "tinyassets-data-")"
          sudo systemctl reset-failed tinyassets-backup.service || true
          set +e
          sudo systemctl start tinyassets-backup.service
          service_rc=$?
          set -e
          invocation_id="$(
            sudo systemctl show tinyassets-backup.service --property=InvocationID --value
          )"
          [[ "${invocation_id}" =~ ^[0-9a-f]{32}$ ]]
          journal="$(
            sudo journalctl "_SYSTEMD_INVOCATION_ID=${invocation_id}" \
              --no-pager --output=cat
          )"
          printf '%s\n' "${journal}" \
            | grep -E 'brain upload OK|  upload OK|off-region upload OK|gh-ship: \[backup-ship\] uploaded:|WARN:|ERROR:|backup complete[.]' \
            || true

          [[ "${service_rc}" -eq 0 ]]
          result="$(
            sudo systemctl show tinyassets-backup.service --property=Result --value
          )"
          [[ "${result}" == "success" ]]
          after_brain="$(latest_archive "tinyassets-brain-")"
          after_full="$(latest_archive "tinyassets-data-")"
          [[ -n "${after_brain}" && "${after_brain}" != "${before_brain}" ]]
          [[ -n "${after_full}" && "${after_full}" != "${before_full}" ]]
          printf '%s\n' "${journal}" | grep -Fq "  brain upload OK"
          printf '%s\n' "${journal}" | grep -Fq "  upload OK"
          # The off-region copy (S1a.3) is the one the weekly DR drill restores.
          printf '%s\n' "${journal}" | grep -Fq "  off-region upload OK"
          printf '%s\n' "${journal}" | grep -Fq "backup complete."
          if printf '%s\n' "${journal}" | grep -Eq 'WARN:|ERROR:'; then
            echo "Backup invocation emitted a warning or error." >&2
            exit 1
          fi
          gh_upload_count="$(
            printf '%s\n' "${journal}" \
              | grep -Fc "gh-ship: [backup-ship] uploaded:" \
              || true
          )"
          # Brain tier only: the full tier exceeds GitHub's 2 GiB asset limit.
          [[ "${gh_upload_count}" -eq 1 ]]
          printf 'Verified fresh backup: brain=%s full=%s github_assets=%s\n' \
            "${after_brain}" "${after_full}" "${gh_upload_count}"
          BACKUP_EXERCISE
