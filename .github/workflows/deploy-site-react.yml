# Deploy WebSite/site-react (Next.js static export) to GitHub Pages.
#
# CURRENT PRODUCTION SITE; MANUAL DEPLOY ONLY via workflow_dispatch.
# Merging React source does not publish it. A host runs this workflow after the
# production React build and retained Svelte rollback parity have been verified.
# See docs/runbooks/2026-06-24-site-react-cutover.md.
#
# deploy-site.yml is the dispatch-only Svelte rollback path. Both workflows
# share the `pages` concurrency group and must never run concurrently. After
# deployment, verify https://tinyassets.io and /mcp via the public canary
# (AGENTS.md hard rule #11).
name: deploy-site-react

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish the current production React build to tinyassets.io'
        required: true
        default: 'no'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Refusing to deploy: type 'deploy' in the confirm input to proceed."
          exit 1

  build:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebSite/site-react
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WebSite/site-react/package-lock.json

      - name: Build design system (workspace dependency)
        working-directory: WebSite/design-system
        run: |
          npm ci
          npm run build

      - name: Install site deps
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebSite/site-react/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
