# Trusted half of the hosted React preview.
#
# workflow_run loads this definition from the default branch. The first job
# validates and sanitizes the untrusted build artifact without an environment
# or secret. A fresh protected-environment job receives only that normalized
# static tree and uploads an undeployed Worker version under a numeric PR alias.
name: preview-worker-deploy

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] trusted code; sanitized static artifact only
    workflows: ["preview-worker"]
    types: [completed]

permissions: {}

concurrency:
  group: preview-worker-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  # Serialize each PR. A queued stale run fails the current-head recheck, while
  # the newest run cannot be raced by an older upload that is still cancelling.
  cancel-in-progress: false

jobs:
  intake:
    name: Validate and sanitize preview artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      alias: ${{ steps.receipt.outputs.alias }}
      head_sha: ${{ steps.receipt.outputs.head_sha }}
      input_artifact_digest: ${{ steps.receipt.outputs.artifact_digest }}
      pr_number: ${{ steps.receipt.outputs.pr_number }}
      sanitized_artifact_digest: ${{ steps.sanitized.outputs.artifact-digest }}
      sanitized_artifact_id: ${{ steps.sanitized.outputs.artifact-id }}
    steps:
      - name: Check out exact trusted intake code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate run, PR, workflow, and exact artifact identity
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/preview-metadata"
          mkdir -p "${metadata}"
          artifact_name="react-preview-${PR_NUMBER}-${RUN_ATTEMPT}"

          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "${metadata}/run.json"
          gh api "repos/${REPOSITORY}/actions/workflows/preview-worker.yml" > "${metadata}/workflow.json"
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${metadata}/pr.json"
          gh api "repos/${REPOSITORY}" > "${metadata}/repository.json"
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=${artifact_name}&per_page=100" > "${metadata}/artifacts.json"

          node trusted-source/WebSite/site/scripts/validate-preview-run.mjs \
            "${metadata}/run.json" \
            "${metadata}/workflow.json" \
            "${metadata}/pr.json" \
            "${metadata}/repository.json" \
            "${metadata}/artifacts.json" \
            "${artifact_name}" > "${metadata}/receipt.json"

          {
            echo "alias=$(jq -r .alias "${metadata}/receipt.json")"
            echo "artifact_digest=$(jq -r .artifactDigest "${metadata}/receipt.json")"
            echo "artifact_id=$(jq -r .artifactId "${metadata}/receipt.json")"
            echo "head_sha=$(jq -r .headSha "${metadata}/receipt.json")"
            echo "pr_number=$(jq -r .prNumber "${metadata}/receipt.json")"
          } >> "${GITHUB_OUTPUT}"

      - name: Download exact immutable build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          path: ${{ runner.temp }}/preview-untrusted
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Sanitize static export and write deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          sanitized="${RUNNER_TEMP}/preview-sanitized"
          mkdir -p "${sanitized}"
          node trusted-source/WebSite/site/scripts/validate-preview-artifact.mjs \
            "${RUNNER_TEMP}/preview-untrusted" \
            "${sanitized}/out" > "${sanitized}/manifest.json"

      - name: Upload immutable sanitized artifact
        id: sanitized
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-preview-sanitized-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/preview-sanitized/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  deploy:
    name: Upload isolated PR preview version
    needs: intake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    environment:
      name: react-preview
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Check out exact trusted deployment code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download exact sanitized artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intake.outputs.sanitized_artifact_id }}
          path: ${{ runner.temp }}/preview-sanitized

      - name: Revalidate manifest and stage trusted Worker
        shell: bash
        run: |
          set -euo pipefail
          deployment="${RUNNER_TEMP}/preview-deployment"
          node trusted-source/WebSite/site/scripts/validate-preview-artifact.mjs \
            "${RUNNER_TEMP}/preview-sanitized/out" \
            "${deployment}/out" > "${RUNNER_TEMP}/manifest.revalidated.json"
          cmp \
            "${RUNNER_TEMP}/preview-sanitized/manifest.json" \
            "${RUNNER_TEMP}/manifest.revalidated.json"
          mkdir -p "${deployment}/cf-worker"
          cp trusted-source/WebSite/site-react/cf-worker/worker.js \
            "${deployment}/cf-worker/worker.js"
          cp trusted-source/WebSite/site-react/wrangler.preview.toml \
            "${deployment}/wrangler.preview.toml"

      - name: Install lockfile-pinned trusted deployment tools
        working-directory: trusted-source/WebSite/site-react/preview-deploy-tools
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-empty-npmrc
        shell: bash
        run: |
          set -euo pipefail
          : > "${NPM_CONFIG_USERCONFIG}"
          npm ci --ignore-scripts --no-audit --no-fund
          npm exec --no -- wrangler --version | grep -qx '4.114.0'

      - name: Recheck current PR head before credential use
        env:
          EXPECTED_HEAD_SHA: ${{ needs.intake.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.intake.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="${RUNNER_TEMP}/current-pr.json"
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_json}"
          test "$(jq -r .state "${pr_json}")" = "open"
          test "$(jq -r .base.ref "${pr_json}")" = "$(jq -r .default_branch < <(gh api "repos/${REPOSITORY}"))"
          test "$(jq -r .head.repo.full_name "${pr_json}")" = "${REPOSITORY}"
          test "$(jq -r .head.sha "${pr_json}")" = "${EXPECTED_HEAD_SHA}"

      - name: Upload trusted per-PR preview version
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ needs.intake.outputs.head_sha }}
          PREVIEW_ALIAS: ${{ needs.intake.outputs.alias }}
          PR_NUMBER: ${{ needs.intake.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::react-preview requires its dedicated account token and account ID."
            exit 1
          fi
          tool="${GITHUB_WORKSPACE}/trusted-source/WebSite/site-react/preview-deploy-tools/node_modules/.bin/wrangler"
          deployment="${RUNNER_TEMP}/preview-deployment"
          output="$("${tool}" versions upload \
            --config "${deployment}/wrangler.preview.toml" \
            --preview-alias "${PREVIEW_ALIAS}" \
            --message "TinyAssets PR #${PR_NUMBER} ${EXPECTED_HEAD_SHA}" \
            --experimental-provision=false \
            --experimental-auto-create=false 2>&1)" || {
              status=$?
              printf '%s\n' "${output}"
              echo "::error::wrangler version upload failed (exit ${status})."
              exit "${status}"
            }
          printf '%s\n' "${output}"
          url="$(printf '%s\n' "${output}" | grep -oE 'https://pr-[0-9]+-tiny-site-react-preview\.[a-z0-9-]+\.workers\.dev' | head -1)"
          expected_url_pattern="^https://${PREVIEW_ALIAS}-tiny-site-react-preview\\.[a-z0-9-]+\\.workers\\.dev$"
          if ! printf '%s\n' "${url}" | grep -qE "${expected_url_pattern}"; then
            echo "::error::Wrangler did not report the expected isolated preview URL."
            exit 1
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Isolated React PR preview"
            echo "PR: #${PR_NUMBER}"
            echo "Head: ${EXPECTED_HEAD_SHA}"
            echo "Preview URL: ${url}"
            echo "Live /mcp: blocked by the trusted Worker"
          } >> "${GITHUB_STEP_SUMMARY}"

  comment:
    name: Comment isolated preview URL
    needs: [intake, deploy]
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Recheck head and upsert preview comment
        env:
          EXPECTED_HEAD_SHA: ${{ needs.intake.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          PR_NUMBER: ${{ needs.intake.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "${PREVIEW_URL}" != ""
          printf '%s\n' "${PREVIEW_URL}" | grep -qE '^https://pr-[0-9]+-tiny-site-react-preview\.[a-z0-9-]+\.workers\.dev$'
          pr_json="${RUNNER_TEMP}/current-pr.json"
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_json}"
          test "$(jq -r .state "${pr_json}")" = "open"
          test "$(jq -r .head.sha "${pr_json}")" = "${EXPECTED_HEAD_SHA}"

          marker="<!-- tinyassets-isolated-preview -->"
          body_file="${RUNNER_TEMP}/preview-comment.md"
          {
            echo "${marker}"
            echo "**Security warning - untrusted PR preview:** ${PREVIEW_URL}"
            echo
            echo "Head: \`${EXPECTED_HEAD_SHA}\`"
            echo
            echo "This URL is isolated to PR #${PR_NUMBER}. Its JavaScript is review input, not trusted product code. Live \`/mcp\` is blocked; the preview uses checked-in public evidence."
          } > "${body_file}"

          comment_id="$(gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | tail -1)"
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              -F "body=@${body_file}" > /dev/null
          else
            gh api --method POST \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${body_file}" > /dev/null
          fi
