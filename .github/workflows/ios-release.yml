name: iOS release IPA

# Builds a SIGNED .ipa and uploads it to App Store Connect (TestFlight), which is
# the iOS counterpart of android-release.yml. ios-build.yml stays the unsigned
# compile-check; this is the only path that produces an artifact a user can
# install.
#
# STATUS: this workflow has never run green, because the Apple Developer Program
# account does not exist yet (docs/ops/app-store-launch.md §0). It is written so
# that the moment enrolment completes and the six secrets below are set, there is
# no pipeline left to build — only a dispatch. Every step that depends on a
# credential fails LOUDLY with the name of the missing secret rather than
# skipping, so a half-configured account cannot look like a successful release.
#
# Signing: certificate and provisioning profile arrive as base64 repo secrets and
# are imported into a TEMPORARY keychain that is deleted in an always() step.
# Nothing is committed, and the App Store Connect key is written to the location
# `xcrun altool` expects and removed on the way out.

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

jobs:
  build-release-ipa:
    runs-on: macos-15
    permissions:
      contents: read
    env:
      BUNDLE_ID: io.tinyassets.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Fail before spending five minutes on a build we cannot sign. Checking the
      # whole set at once also means the founder gets one list of what is missing
      # rather than discovering them one failed run at a time.
      - name: Require the signing secrets
        env:
          CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          set -euo pipefail
          set +x
          missing=""
          [ -n "${CERT_B64:-}" ]       || missing="$missing APPLE_DISTRIBUTION_CERT_P12_B64"
          [ -n "${CERT_PASSWORD:-}" ]  || missing="$missing APPLE_DISTRIBUTION_CERT_PASSWORD"
          [ -n "${PROFILE_B64:-}" ]    || missing="$missing APPLE_PROVISIONING_PROFILE_B64"
          [ -n "${ASC_KEY_ID:-}" ]     || missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -n "${ASC_ISSUER_ID:-}" ]  || missing="$missing APP_STORE_CONNECT_API_KEY_ISSUER_ID"
          [ -n "${ASC_KEY_B64:-}" ]    || missing="$missing APP_STORE_CONNECT_API_KEY_B64"
          if [ -n "$missing" ]; then
            echo "::error::missing signing secrets:$missing — see docs/ops/app-store-launch.md §3. Enrolment in the Apple Developer Program comes first."
            exit 1
          fi
          echo "all six signing secrets present"

      - name: Install JS deps (lockfile-pinned)
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add + sync iOS platform
        working-directory: mobile
        run: |
          npx --no-install cap add ios
          npx --no-install cap sync ios

      - name: Register the tinyassets:// URL scheme (in-app OAuth return)
        working-directory: mobile
        run: |
          python3 scripts/add_ios_scheme.py
          grep -q "<string>tinyassets</string>" ios/App/App/Info.plist

      # The certificate password reaches `security import` through argv, which is
      # not ideal and cannot be avoided: unlike keytool's `-storepass:env`, the
      # `security` tool has no env-var form. The exposure is bounded to this
      # ephemeral runner. Stated rather than papered over.
      - name: Import signing assets into a temporary keychain
        id: signing
        env:
          CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          set +x
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          cert="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$CERT_B64" | base64 -d > "$cert"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$cert"
          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"/ {print $2; exit}')"
          [ -n "$identity" ] || { echo "::error::no codesigning identity in the imported certificate"; exit 1; }
          echo "imported codesigning identity $identity"

          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | base64 -d > "$profile"
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          # Xcode locates a profile by its UUID, not its filename.
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
          # Derive the team from the profile so the founder needs no seventh secret.
          team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")"
          [ -n "$uuid" ] && [ -n "$team" ] || { echo "::error::could not read UUID/team from the provisioning profile"; exit 1; }
          cp "$profile" "$profiles_dir/$uuid.mobileprovision"
          rm -f "$profile" "$plist"

          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "profile_name=$name" >> "$GITHUB_OUTPUT"
          echo "team=$team" >> "$GITHUB_OUTPUT"
          echo "profile '$name' installed for team $team"

      - name: Archive (Release, manual signing)
        working-directory: mobile/ios/App
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          TEAM: ${{ steps.signing.outputs.team }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          # Capacitor 8 uses Swift Package Manager, so there is no .xcworkspace
          # unless a CocoaPods integration reappears (same shape as ios-build.yml).
          target=(-project App.xcodeproj)
          if [ -d App.xcworkspace ]; then target=(-workspace App.xcworkspace); fi
          xcodebuild \
            "${target[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive | tail -40
          [ -d "$RUNNER_TEMP/App.xcarchive" ] || { echo "::error::no .xcarchive produced"; exit 1; }

      - name: Export the .ipa
        id: export
        env:
          TEAM: ${{ steps.signing.outputs.team }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$opts" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$opts" \
            -exportPath "$RUNNER_TEMP/export" | tail -20
          ipa="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print -quit)"
          [ -n "$ipa" ] || { echo "::error::export produced no .ipa"; exit 1; }
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          ls -la "$ipa"

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          IPA: ${{ steps.export.outputs.ipa }}
        run: |
          set -euo pipefail
          set +x
          # altool reads the key from this fixed location, by key id.
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$keydir/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "uploaded — the build appears in TestFlight after Apple finishes processing"

      - name: Upload the .ipa as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tinyassets-release-ipa
          path: ${{ steps.export.outputs.ipa }}
          if-no-files-found: error

      # always(): a failed archive must not leave a signing identity or the App
      # Store key sitting on the runner.
      - name: Remove the temporary keychain and API key
        if: always()
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          set +x
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
          echo "signing material removed"
