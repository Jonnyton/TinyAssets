name: Docker build smoke

# Self-host migration Row A drift protection per
# docs/exec-plans/active/2026-04-20-selfhost-uptime-migration.md.
#
# Fires on any change that could plausibly break the Dockerfile build:
# the Dockerfile itself, .dockerignore, pyproject.toml (dep changes),
# tinyassets/** (source the builder stage installs), deploy/** (future
# Row C + D wiring). Manual dispatch for host-triggered re-verification.
#
# Intentionally NOT folded into tier3-oss-clone-nightly — that one runs
# at 07:17 UTC on a schedule. Dockerfile changes want push-triggered
# feedback, not overnight discovery.

on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'tinyassets/**'
      - 'domains/**'
      - 'deploy/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'tinyassets/**'
      - 'domains/**'
      - 'deploy/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        # Pin explicitly so the "MCP initialize smoke" step runs on a
        # known interpreter version instead of whatever the runner
        # happens to ship. Matches the Dockerfile's python:3.11-slim
        # base so builder + canary agree on syntax + stdlib behavior.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TinyAssets daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: tinyassets-daemon:ci
          load: true                  # keep the image local for the run step
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          # The daemon serves nobody anonymously: dev auth mode needs a named
          # local operator, and the smoke below probes as the canary principal
          # with a token minted here for this run only.
          CANARY_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::${CANARY_TOKEN}"
          echo "TINYASSETS_WIKI_CANARY_TOKEN=${CANARY_TOKEN}" >> "$GITHUB_ENV"
          docker run -d --rm \
              --name tinyassets-daemon-ci \
              -p 8001:8001 \
              -e TINYASSETS_IMAGE=tinyassets-daemon:ci \
              -e UNIVERSE_SERVER_DEV_USER=ci-smoke \
              -e TINYASSETS_WIKI_CANARY_TOKEN="${CANARY_TOKEN}" \
              tinyassets-daemon:ci

          # Give uvicorn + FastMCP a moment to bind. Poll rather than
          # sleep-blindly so slow cold-starts don't false-fail.
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -w "%{http_code}" \
                 -X POST http://localhost:8001/mcp \
                 -H "Content-Type: application/json" \
                 -H "Accept: application/json, text/event-stream" \
                 -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                 | grep -qE '^(200|401)$'; then
              # 401 is the daemon answering its own auth challenge to an
              # anonymous initialize; that is reachability, not an error.
              echo "Daemon reachable after $i poll(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Daemon never became reachable on port 8001"
          docker logs tinyassets-daemon-ci || true
          exit 1

      - name: MCP initialize smoke
        run: |
          # Full MCP handshake via the same canary script the live tray
          # uses. Exit 0 = green image; any nonzero = regression to
          # investigate.
          python scripts/mcp_public_canary.py \
              --url http://localhost:8001/mcp \
              --timeout 15 \
              --verbose

      - name: Container logs on success
        if: success()
        run: docker logs tinyassets-daemon-ci | tail -50 || true

      - name: Container logs on failure
        if: failure()
        run: |
          echo "::error::Docker build or smoke failed"
          docker logs tinyassets-daemon-ci 2>&1 || true
          docker ps -a || true

      - name: Stop container
        if: always()
        run: docker stop tinyassets-daemon-ci || true
