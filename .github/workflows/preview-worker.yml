# Untrusted half of the hosted React preview.
#
# Pull-request code controls package scripts and dependencies, so this workflow
# has no deployment secret or write permission. It transfers only the static
# export to preview-worker-deploy.yml, whose trusted default-branch copy owns
# the credentialed deployment.
name: preview-worker

on:
  pull_request:
    paths:
      - 'WebSite/site-react/**'
      - 'WebSite/shared/**'
      - 'WebSite/design-system/**'
      - '.github/workflows/preview-worker.yml'
      - '.github/workflows/preview-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: preview-worker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build untrusted static preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build design system
        working-directory: WebSite/design-system
        run: |
          npm ci
          npm run build

      - name: Test preview-security contracts, then build the static site (root, same-origin /mcp)
        working-directory: WebSite/site-react
        env:
          NEXT_PUBLIC_MCP_PATH: '/mcp'
        run: |
          npm ci
          npm test
          npm run build
          rm -f out/CNAME

      - name: Upload static preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-preview-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: WebSite/site-react/out/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1
