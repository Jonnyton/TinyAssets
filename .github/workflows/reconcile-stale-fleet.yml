name: Reconcile stale fleet

# Host-triggered runner for the safe stale-fleet reconciler (PR #2514,
# tinyassets/runtime_reconcile.py). SSHes to the droplet and `docker exec`s the
# reconciler INSIDE the running daemon container (where /data + the code live).
#
# DRY-RUN by default: prints the plan (the stale epoch-2 pending tasks stuck in
# awaiting_compatible_capacity + stale provisioned cloud_worker runtimes) plus a
# stable plan digest and exact counts. Nothing is written.
#
# APPLY requires the operator to paste back the digest + both counts they reviewed
# from a dry-run. The reconciler itself recomputes the plan and ABORTS before any
# write if the digest or counts differ (CAS + digest guarded, cancel/retire only,
# never DELETE). So a stale review can never apply an unreviewed change.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (safe, prints plan) or apply (requires reviewed digest+counts)"
        type: choice
        options: ["dry-run", "apply"]
        default: "dry-run"
        required: true
      older_than_hours:
        description: "Only select artifacts older than this many hours"
        type: string
        default: "336"
        required: true
      expected_plan_digest:
        description: "apply only: the plan_digest from the reviewed dry-run"
        type: string
        default: ""
        required: false
      expect_task_count:
        description: "apply only: the task_count from the reviewed dry-run"
        type: string
        default: ""
        required: false
      expect_runtime_count:
        description: "apply only: the runtime_count from the reviewed dry-run"
        type: string
        default: ""
        required: false

permissions:
  contents: read

env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: SSH + docker exec the reconciler
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          MODE: ${{ inputs.mode }}
          OLDER_THAN_HOURS: ${{ inputs.older_than_hours }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          EXPECT_TASK_COUNT: ${{ inputs.expect_task_count }}
          EXPECT_RUNTIME_COUNT: ${{ inputs.expect_runtime_count }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "apply" ]; then
            if [ -z "$EXPECTED_PLAN_DIGEST" ] || [ -z "$EXPECT_TASK_COUNT" ] || [ -z "$EXPECT_RUNTIME_COUNT" ]; then
              echo "::error::apply requires expected_plan_digest, expect_task_count, and expect_runtime_count from a reviewed dry-run"
              exit 1
            fi
          fi
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              MODE="$MODE" OLDER_THAN_HOURS="$OLDER_THAN_HOURS" \
              EXPECTED_PLAN_DIGEST="$EXPECTED_PLAN_DIGEST" \
              EXPECT_TASK_COUNT="$EXPECT_TASK_COUNT" \
              EXPECT_RUNTIME_COUNT="$EXPECT_RUNTIME_COUNT" \
              bash -s <<'REMOTE'
          set -euo pipefail
          CN=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -i tinyassets | head -1)
          if [ -z "$CN" ]; then echo "::error::no running tinyassets container"; exit 1; fi
          echo "container=$CN mode=$MODE older_than_hours=$OLDER_THAN_HOURS"
          if [ "$MODE" = "apply" ]; then
            docker exec -e TINYASSETS_DATA_DIR=/data "$CN" \
              python -m tinyassets.runtime_reconcile stale-fleet \
                --older-than-hours "$OLDER_THAN_HOURS" \
                --data-dir /data \
                --apply \
                --expected-plan-digest "$EXPECTED_PLAN_DIGEST" \
                --expect-task-count "$EXPECT_TASK_COUNT" \
                --expect-runtime-count "$EXPECT_RUNTIME_COUNT"
          else
            docker exec -e TINYASSETS_DATA_DIR=/data "$CN" \
              python -m tinyassets.runtime_reconcile stale-fleet \
                --older-than-hours "$OLDER_THAN_HOURS" \
                --data-dir /data \
                --dry-run
          fi
          REMOTE
