name: Ensure App Store internal tester

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: App Store Connect app resource ID
        required: true
        default: "6808434444"
        type: string
      group_name:
        description: Exact internal TestFlight group name
        required: true
        default: "Internal"
        type: string
      apply:
        description: Add the account holder when absent
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: app-store-internal-tester
  cancel-in-progress: false

jobs:
  ensure-internal-tester:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install JWT signing dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyJWT[crypto]==2.10.1"

      - name: Inspect or add the account holder to internal TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          APP_ID: ${{ inputs.app_id }}
          GROUP_NAME: ${{ inputs.group_name }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          python scripts/app_store_internal_tester.py
