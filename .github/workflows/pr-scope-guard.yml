name: PR scope guard

# Why this exists
# ---------------
# Green checks are not sufficient to auto-merge safely. PR #1491 presented as a
# two-file auth fix and CI was happy — but its diff against main carried seven
# workflow files plus deploy-prod.yml and Dockerfile, because the branch sat on
# an unmerged 217-commit lineage. Nothing in CI objected; only inspecting the
# DIFF SCOPE caught it. With auto-merge enabled, that PR would have shipped
# changes to the production deploy workflow under the banner of an auth fix.
#
# So: a PR that touches release-critical infrastructure must say so explicitly,
# via the `infra-change` label. This is a scope-declaration gate, not a security
# control — see the honesty note at the bottom of this file.
#
# Since 2026-09-26 the exact-head receipt this guard already demanded on
# gate-defining and authority paths has to be a PUBLISHED APPROVAL, not a
# bookmark. PR #3989 auto-merged at the exact head its Tier 2 reviewer had
# BLOCKED, because a verdict lives in a PR comment and auto-merge reads only
# required checks. So the receipt must now cite a comment on this PR that a
# trusted author wrote and that itself says APPROVE for the current head. WHO
# needs a receipt did not change.
#
# MUST run unconditionally (no `paths:` filter). A required status check that is
# path-filtered never reports on PRs outside those paths, and the PR then hangs
# forever on "Expected — waiting for status". `lint`/actionlint is path-filtered
# for exactly this reason and must NOT be added as a required check.

on:
  # pull_request_target: this workflow is always the TRUSTED copy from the default
  # branch. With plain `pull_request`, a PR could edit the very workflow that
  # judges it — the guard would grade its own homework. We never check out or
  # execute PR-head code here, so using _target is safe.
  pull_request_target:
    # `labeled`/`unlabeled` matter: declaring an infra change must re-run the gate.
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-scope-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Diff scope declared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Require exact-head review for drain PRs
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.md"
          python scripts/drain_review_gate.py \
            --branch "${HEAD_REF}" \
            --head "${HEAD_OID}" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      # Under pull_request_target, only the trusted base SHA above is checked out.
      # The PR head is never executed with this workflow's token. The file list
      # below comes from the API.
      - name: Compare the PR diff against release-critical paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_OID: ${{ github.event.pull_request.head.sha }}
          BASE_OID: ${{ github.event.pull_request.base.sha }}
          # The body is author-controlled text. It is read through the
          # environment and never interpolated into this script, so a body
          # containing shell metacharacters is data, not code.
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          # Release-critical: anything that can change how the product is built,
          # deployed, or what runs in production.
          #
          # packaging/ is deliberately EXCLUDED. The plugin mirror there is a
          # GENERATED artifact that legitimately changes with most canonical
          # tinyassets/* PRs, and it already has its own parity check. Including it
          # flagged 4 of 5 sampled real PRs, which would have trained everyone to
          # rubber-stamp the infra-change label and defeated the guard.
          # scripts/ci_required_tests.py and .github/known-failing-tests.txt are
          # here because they ARE the `required-tests` gate. That gate runs from
          # the PR's own checkout (it must — it executes the PR's code), so a PR
          # can rewrite the thing judging it while keeping the check name green.
          # Workflow files were already covered; without these two entries the
          # same neutering could be done one directory over, undeclared.
          SENSITIVE_RE='^(\.github/workflows/|\.github/known-failing-tests\.txt$|\.github/heavy-test-files\.txt$|scripts/ci_required_tests\.py$|scripts/drain_review_gate\.py$|deploy/|Dockerfile$|\.dockerignore$)'

          # Paginated API read. Fail CLOSED on error — a guard that silently
          # sees fewer files than the PR contains is worse than none.
          # Project BOTH the new path and, for renames, the previous one. Reading
          # only `.filename` let a PR move tinyassets/auth/provider.py to an
          # unprotected path and escape the authority receipt entirely -- the
          # gate saw only the destination (cross-family review 2026-08-26).
          if ! CHANGED="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files"                             --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null)"; then
            echo "::error::could not read the PR file list — failing closed"
            exit 1
          fi

          TOTAL="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"

          # The endpoint caps at 3000 files and says nothing when it truncates.
          # An earlier version of this comment claimed the read above already
          # failed closed on truncation; it did not, and a cross-family review
          # caught the false assurance. At the cap we cannot know whether the
          # unseen files are release-critical, so refuse rather than guess —
          # a diff that large needs splitting regardless.
          API_FILE_CAP=3000
          if [ "$TOTAL" -ge "$API_FILE_CAP" ]; then
            echo "::error::PR file list hit the ${API_FILE_CAP}-file API cap — the diff cannot be fully inspected"
            {
              echo "### PR scope guard"
              echo ""
              echo "**Blocked — diff exceeds what the API will report.** ${TOTAL} files;"
              echo "the endpoint caps at ${API_FILE_CAP} and does not report truncation, so"
              echo "release-critical files could be present and invisible to this check."
              echo ""
              echo "Split the PR, or rebase it if it is carrying an unmerged lineage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # `|| true` here USED to swallow an execution error as well as "no
          # match": grep exits 1 for no match and 2+ for a real failure, and a
          # failure read as an empty hit list means "no release-critical paths
          # touched" — fail-open on the exact question this gate answers. Found
          # by cross-family review 2026-09-26 (finding 3) by injecting exit 2.
          classify() {
            local rc=0
            if [ -n "$2" ]; then
              printf '%s\n' "$CHANGED" | grep "$2" -E "$1" || rc=$?
            else
              printf '%s\n' "$CHANGED" | grep -E "$1" || rc=$?
            fi
            if [ "$rc" -gt 1 ]; then
              echo "::error::grep exited ${rc} classifying paths — failing closed" >&2
              return 1
            fi
          }
          HITS="$(classify "$SENSITIVE_RE" "")" || exit 1
          HIT_COUNT="$(printf '%s\n' "$HITS" | sed '/^$/d' | wc -l | tr -d ' ')"

          # The files below DEFINE the required-tests gate (and this guard's
          # own receipt checker). The gate executes the PR's checkout, so a PR
          # editing them can neuter the check while its name stays green. A
          # label is a declaration, not authorization — editing these demands
          # the same exact-head review receipt drain PRs carry (Codex gate
          # review 2026-08-02, finding 2). This runs from the TRUSTED base
          # checkout, so a PR cannot weaken the rule that judges it.
          # This workflow protects ITSELF. Without it, a later PR could narrow or
          # delete AUTHORITY_RE with only an `infra-change` label -- permanently
          # weakening exact-head enforcement for every PR after it. A gate that
          # anyone can quietly disable is not a gate.
          #
          # WHO needs a receipt is deliberately UNCHANGED as of 2026-09-26: this
          # set plus AUTHORITY_RE, exactly as before. Widening it to every
          # release-critical path, the `infra-change` label and a Tier 2 title
          # was built and then CUT -- measured against the 60 most recently
          # merged PRs it would have made 29 of them wait for a stamp, and the
          # founder's direction is that the process is already bloated. What
          # changed on 2026-09-26 is only WHAT a receipt has to be: see the
          # attestation requirement below and in scripts/drain_review_gate.py.
          # `check_context_budget.py` and `test_rulebook_ratchet.py` are the
          # rulebook ratchet: they pin how large the always-loaded rule files may
          # be. RAISING a pin is the bypass direction and it is a one-line edit,
          # so it needs the same receipt. The ratchet test arrives with #4025;
          # naming it here first costs nothing, because a path that does not
          # exist simply never matches.
          GATE_RE='^(\.github/workflows/tests\.yml$|\.github/workflows/pr-scope-guard\.yml$|\.github/known-failing-tests\.txt$|\.github/heavy-test-files\.txt$|scripts/ci_required_tests\.py$|scripts/drain_review_gate\.py$|scripts/check_context_budget\.py$|tests/test_rulebook_ratchet\.py$)'
          GATE_HITS="$(classify "$GATE_RE" "")" || exit 1

          # AUTHORITY paths carry the same receipt requirement, for a different
          # reason: a bug here is privilege escalation or credential disclosure,
          # not a broken build. AGENTS.md already REQUIRES exact-head approval
          # for auth/storage/public-surface changes -- this makes that stated
          # rule executable rather than adding a new one.
          #
          # Scoped to where the repeat actually happened. Every file below is
          # named in an open finding in docs/concerns/: the write-ACL tier grant
          # (api/interlocutor.py), the ambient identity fallback
          # (api/engine_helpers.py), founder canon defaulting public
          # (api/visibility.py), and the credential-vault fail-open. The shared
          # shape is that all of them LANDED and were found later by
          # cross-family review -- the gap is not "no review", it is review not
          # bound to the merge, which is exactly what an exact-head receipt
          # binds.
          #
          # Deliberately narrow: ~7% of recent commits touch these paths. A
          # blanket receipt requirement across tinyassets/ would be the process
          # bloat this repo just removed.
          # Matched case-INSENSITIVELY (-i) and anchored at either the repo root
          # or the packaging runtime mirror. Three bypasses this closes, all
          # confirmed by regex probe before the fix:
          #   - `TinyAssets/Auth/...` differing only in case
          #   - the shipped mirror at packaging/claude-plugin/plugins/
          #     tinyassets-universe-server/runtime/tinyassets/auth/, which
          #     contains the same authority code and was unprotected
          #   - renames, handled by the previous_filename projection above
          # ANCHORED to the two real roots. `(^|/)tinyassets/` was permissive so
          # the packaging mirror would match, but it also matched ANY nested
          # copy: `docs/audits/harness-reset-preserved/.../tinyassets/api/
          # permissions.py` is an archived snapshot, not the authority surface,
          # and DELETING four such copies is what blocked PR #2561 for six review
          # rounds. Naming both roots keeps the mirror covered and stops the
          # guard policing docs.
          # WIDENED 2026-08-27, because the narrow list let an authority change
          # ship unreviewed. PR #2559 changed WHEN foreground runs mint provider
          # authority -- splitting admission into prepare()/lazy _admit() -- and
          # touched foreground_run_provider.py, provider_work_authority.py and
          # providers/router.py. None were listed, so no receipt was demanded and
          # auto-merge took it. The post-merge review then found three Medium
          # findings on code that was already live, including async sub-branches
          # failing outright.
          #
          # Still deliberately NOT a blanket `tinyassets/` rule -- that was
          # rejected as process bloat and the reasoning holds. These are the
          # modules that mint, bind, or validate provider authority.
          # `providers/router.py` and `storage/provider_work_authority.py` were
          # MISSED in the first widening -- the comment above named router.py as
          # part of what escaped and the regex still omitted it. router.py validates
          # carriers and classifies receipt settlement; storage/ persists and mints
          # receipts, claims and invocation reservations. Both now covered.
          AUTHORITY_RE='^(tinyassets|packaging/claude-plugin/plugins/tinyassets-universe-server/runtime/tinyassets)/(auth/|execution_authority/|credential_vault\.py$|foreground_run_provider\.py$|provider_work_authority\.py$|provider_serving_binding\.py$|provider_assignment\.py$|providers/router\.py$|storage/provider_work_authority\.py$|api/(permissions|interlocutor|visibility|engine_helpers)\.py$)'
          AUTHORITY_HITS="$(classify "$AUTHORITY_RE" "-i")" || exit 1

          # GROUNDED, not regex-only. A path match says WHERE an edit landed,
          # never WHETHER it can escalate a privilege. PR #2561's entire
          # authority change was ONE docstring line repointing a spec path after
          # archiving -- an unbounded prose review demanded for a comment.
          #
          # authority_behavior_check.py parses both revisions, strips docstrings,
          # and compares ASTs. It fails CLOSED on an add, a delete, a rename, a
          # syntax error, a non-Python path, or an unreadable blob, so the
          # receipt stands down only when the code is PROVABLY unchanged. It runs
          # from this trusted base checkout and only ever ast.parse()s the head
          # blob -- parsing never executes it.
          # EXEMPT_FIRED records that a CONTENT PROOF cleared a hit, and
          # FOOTPRINT_EXEMPT below only trusts it when it accounts for the WHOLE
          # footprint. One unproven hit left over and the receipt stands.
          EXEMPT_FIRED=0
          if [ -n "$AUTHORITY_HITS" ]; then
            git fetch --no-tags --depth=1 origin "$HEAD_OID" >/dev/null 2>&1 || true
            # Explicit array, not bare word-splitting: each hit is its own argv
            # entry, and a path containing a space must not become two arguments.
            mapfile -t AUTHORITY_ARR <<< "$AUTHORITY_HITS"
            if python scripts/authority_behavior_check.py \
                 --base "$BASE_OID" --head "$HEAD_OID" "${AUTHORITY_ARR[@]}"; then
              echo "authority hits are comment/docstring-only -- receipt not required"
              AUTHORITY_HITS=""
              EXEMPT_FIRED=1
            fi
          fi

          # The receipt footprint: the gate-defining files plus every authority
          # path that survived the AST proof, deduplicated. Either list may name
          # a file twice (the rename projection emits both names).
          RECEIPT_HITS="$(printf '%s\n%s\n' "$GATE_HITS" "$AUTHORITY_HITS" | sed '/^$/d' | sort -u)"

          # Exception: a DELETION-ONLY ledger edit is the maintenance the gate
          # itself forces (stale quarantine entries fail the run) and only
          # tightens the ratchet. ADDING a quarantine line is the bypass
          # direction and keeps the receipt requirement.
          #
          # Decided on the `additions` COUNT, never on `.patch`: GitHub omits
          # `patch` for binary files and drops it entirely on large diffs, so a
          # patch-grep silently sees "no additions" and waves the edit through
          # (Codex review 2026-08-02, finding 1 — this exact fail-open). The
          # count is trusted metadata and is always present. Anything that is
          # not a clean numeric 0 keeps the receipt requirement.
          if [ "$RECEIPT_HITS" = ".github/known-failing-tests.txt" ]; then
            # Compare CONTENT, not diff metadata. GitHub reports additions: 0
            # for binary files and for pure renames alike, so a NUL-poisoned
            # ledger or a pre-planted file renamed into place both read as
            # "no additions" (verified on PRs #2041/#2172).
            #
            # Read through the GIT TREE, not the Contents API: that API
            # DEREFERENCES symlinks, so swapping the ledger for a link to
            # identical content reads as a no-op — and the link target is not
            # a gate-protected path, so a later PR edits it freely. The tree
            # gives the true blob mode and size; the blob endpoint gives the
            # bytes of that exact blob. Every failure below leaves RECEIPT_HITS
            # intact, i.e. requires a receipt.
            HEAD_LEDGER="$RUNNER_TEMP/head-ledger.txt"
            : > "$HEAD_LEDGER"
            LEDGER_MODE=""; LEDGER_SIZE=""
            if TREE_ROW="$(gh api "repos/${REPO}/git/trees/${HEAD_OID}:.github" \
                --jq '.tree[] | select(.path=="known-failing-tests.txt") | "\(.mode) \(.size) \(.sha)"' \
                2>/dev/null)" && [ "$(printf '%s\n' "$TREE_ROW" | wc -l)" -eq 1 ]; then
              LEDGER_MODE="$(printf '%s' "$TREE_ROW" | cut -d' ' -f1)"
              LEDGER_SIZE="$(printf '%s' "$TREE_ROW" | cut -d' ' -f2)"
              LEDGER_SHA="$(printf '%s' "$TREE_ROW" | cut -d' ' -f3)"
              if ! gh api "repos/${REPO}/git/blobs/${LEDGER_SHA}" --jq '.content' 2>/dev/null \
                  | tr -d '\n' | base64 -d > "$HEAD_LEDGER" 2>/dev/null; then
                : > "$HEAD_LEDGER"   # partial decode must not read as a deletion
              fi
            fi
            # The decision (mode/size trust + entry comparison) lives in the
            # policy script so every branch of it is unit tested.
            if python scripts/drain_review_gate.py \
                --ledger-base-file .github/known-failing-tests.txt \
                --ledger-head-file "$HEAD_LEDGER" \
                --ledger-head-mode "${LEDGER_MODE}" \
                --ledger-head-size "${LEDGER_SIZE}" \
                --branch "${HEAD_REF}" --head "${HEAD_OID}" --body-file "$HEAD_LEDGER"; then
              echo "scope guard: ledger edit removes entries only — receipt not required"
              RECEIPT_HITS=""
              EXEMPT_FIRED=1
            else
              echo "ledger edit adds entries, or the head blob was not a trustworthy regular file — receipt required"
            fi
          fi

          # A content proof only outranks the label when it accounts for the
          # PR's ENTIRE release-critical/authority footprint. One unproven hit
          # left over and the receipt stands.
          FOOTPRINT_EXEMPT=0
          if [ "$EXEMPT_FIRED" -eq 1 ] && [ -z "$RECEIPT_HITS" ]; then
            FOOTPRINT_EXEMPT=1
          fi

          # The receipt's artifact must be a comment ON THIS PR that a trusted
          # author published, AND that comment must itself attest
          # `Drain-Review-Verdict: APPROVE` / `Drain-Review-Head: <this head>`.
          # Without the URL check the artifact was any string matching a URL
          # shape; without the BODY check, cross-family review 2026-09-26
          # (finding 6) got a receipt past the gate by citing an OWNER comment
          # that said `VERDICT: BLOCK` for that exact head. The body check is
          # also what closes the stale-comment gap, with no clock involved.
          #
          # Read from the API, so it is GitHub's `author_association` deciding
          # trust rather than anything the PR controls. Three sources, because a
          # verdict legitimately lands in any of them: a top-level comment, a
          # submitted review, an inline review comment.
          #
          # A failed read REMOVES the inventory rather than failing the step. A
          # PR that needs no receipt must not be blocked by an unrelated API
          # blip; a PR that needs one then finds no inventory and is denied.
          COMMENTS_FILE="$RUNNER_TEMP/pr-comments.ndjson"
          rm -f "$COMMENTS_FILE"
          for ENDPOINT in "issues/${PR}/comments" "pulls/${PR}/comments" "pulls/${PR}/reviews"; do
            if ! gh api --paginate "repos/${REPO}/${ENDPOINT}" \
                --jq '.[] | {url: .html_url, association: .author_association, body: (.body // "")}' \
                >> "$COMMENTS_FILE" 2>/dev/null; then
              echo "::warning::could not read ${ENDPOINT} — a receipt requirement fails closed"
              rm -f "$COMMENTS_FILE"
              break
            fi
          done

          printf '%s\n' "$RECEIPT_HITS" | sed '/^$/d' > "$RUNNER_TEMP/receipt-hits.txt"
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body-gate.md"
          # Seeded with the mode flag so the array is never empty, which `set -u`
          # would otherwise make an error on expansion.
          RECEIPT_ARGS=(--blocking-review)
          if [ "$FOOTPRINT_EXEMPT" -eq 1 ]; then
            RECEIPT_ARGS+=(--review-footprint-exempt)
          fi
          # Every trigger, every exemption and the receipt parse itself are one
          # decision in one unit-tested place. stderr carries the reason, so it
          # can be shown on the PR whether the answer is allow or deny.
          if ! python scripts/drain_review_gate.py \
              "${RECEIPT_ARGS[@]}" \
              --branch "${HEAD_REF}" \
              --head "${HEAD_OID}" \
              --body-file "$RUNNER_TEMP/pr-body-gate.md" \
              --review-hits-file "$RUNNER_TEMP/receipt-hits.txt" \
              --review-repo "${REPO}" \
              --review-pr "${PR}" \
              --review-comments-file "$COMMENTS_FILE" \
              2> "$RUNNER_TEMP/receipt-why.txt"; then
            {
              echo "### PR scope guard"
              echo ""
              echo "**Blocked — no exact-head blocking-review receipt.**"
              echo ""
              sed 's/^/> /' "$RUNNER_TEMP/receipt-why.txt"
              echo ""
              echo "**Two steps, both required. Each receipt goes at the TOP.**"
              echo ""
              echo "1. The reviewer POSTS the verdict as a comment on this PR."
              echo "   These must be its FIRST two non-blank lines:"
              echo ""
              echo '   ```'
              echo "   Drain-Review-Verdict: APPROVE"
              echo "   Drain-Review-Head: ${HEAD_OID}"
              echo '   ```'
              echo ""
              echo "   Reasoning and evidence go BELOW them."
              echo ""
              echo "2. The PR BODY then cites that comment. These must be its"
              echo "   FIRST three non-blank lines:"
              echo ""
              echo '   ```'
              echo "   Drain-Review-Verdict: APPROVE"
              echo "   Drain-Review-Head: ${HEAD_OID}"
              echo "   Drain-Review-Artifact: https://github.com/${REPO}/pull/${PR}#issuecomment-<id>"
              echo '   ```'
              echo ""
              echo "The artifact must link a comment, review or review comment on"
              echo "THIS PR whose author is a repository owner, member or"
              echo "collaborator AND which OPENS with the APPROVE lines above."
              echo "Only \`APPROVE\` counts — a BLOCK verdict can never satisfy"
              echo "this, in the body or in the comment."
              echo ""
              echo "**Only the top is read**, so nothing below either receipt can"
              echo "void it and nothing above it can hide it. A receipt in a"
              echo "fenced block, an HTML comment, a \`<details>\` or a quote is"
              echo "simply not at the top. If yours is being refused, MOVE IT UP:"
              echo "only blank lines may precede it."
              echo "Re-stamp after every push: the head SHA must match exactly,"
              echo "in BOTH places."
              # Both complaints at once. The receipt is checked before the label
              # declaration below, so reporting only this one sends a legitimate
              # PR round the loop twice: stamp, still red, then add the label.
              if [ "$HIT_COUNT" -gt 0 ]; then
                case ",${LABELS}," in
                  *,infra-change,*) ;;
                  *)
                    echo ""
                    echo "This PR also needs the \`infra-change\` label:"
                    echo "${HIT_COUNT} release-critical file(s) are undeclared."
                    ;;
                esac
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "scope guard: BLOCKED — no exact-head blocking-review receipt"
            cat "$RUNNER_TEMP/receipt-why.txt" || true
            exit 1
          fi
          cat "$RUNNER_TEMP/receipt-why.txt" || true

          echo "### PR scope guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Files changed vs merge-base: **${TOTAL}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Release-critical files touched: **${HIT_COUNT}**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$HIT_COUNT" -eq 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No release-critical paths touched." >> "$GITHUB_STEP_SUMMARY"
            echo "scope guard: clean (${TOTAL} files, none release-critical)"
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Release-critical files</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2016  # the $ is sed's end-of-line anchor, not a variable
          printf '%s\n' "$HITS" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          # HARD CAPS — no label bypasses these. A label is a declaration of intent,
          # not authorization: it can be applied by any writer, is not bound to a head
          # SHA, and goes stale the moment someone pushes again. PR #1491 is the case
          # that proves it — 386 changed files and 16 release-critical, which a bare
          # label would have waved straight through into auto-merge.
          # The RISK is release-critical breadth, not raw size. #1491 was dangerous
          # because it carried 16 release-critical files while claiming to be a
          # two-file auth fix — not merely because it was large. So:
          #
          #   MAX_SENSITIVE is a HARD cap. No label clears it. Past this, a branch
          #   is almost certainly dragging an unmerged lineage and must be rebased.
          #
          #   Total size is only a PROXY for that bloat, so it is declarable. PR
          #   #1490 proved the difference: a legitimate 166-file recovery touching
          #   ONE workflow was blocked by a size cap it had no way to satisfy, while
          #   posing none of the risk the cap exists to catch.
          MAX_SENSITIVE=8
          if [ "$HIT_COUNT" -gt "$MAX_SENSITIVE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Blocked — beyond the label's authority.** ${HIT_COUNT} release-critical files (hard cap ${MAX_SENSITIVE})." >> "$GITHUB_STEP_SUMMARY"
            echo "A branch touching this many release-critical files is almost certainly" >> "$GITHUB_STEP_SUMMARY"
            echo "carrying an unmerged lineage. Rebase onto the target branch, or split it." >> "$GITHUB_STEP_SUMMARY"
            echo "The \`infra-change\` label cannot clear this." >> "$GITHUB_STEP_SUMMARY"
            echo "scope guard: BLOCKED — ${HIT_COUNT} release-critical files exceeds hard cap ${MAX_SENSITIVE}"
            exit 1
          fi

          LARGE_TOTAL=150
          if [ "$TOTAL" -gt "$LARGE_TOTAL" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Note: ${TOTAL} files changed (advisory threshold ${LARGE_TOTAL}) with only ${HIT_COUNT} release-critical." >> "$GITHUB_STEP_SUMMARY"
            echo "Large but narrow — allowed when declared." >> "$GITHUB_STEP_SUMMARY"
          fi

          case ",${LABELS}," in
            *,infra-change,*)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Declared via the \`infra-change\` label — allowed." >> "$GITHUB_STEP_SUMMARY"
              echo "scope guard: ${HIT_COUNT} release-critical file(s), declared by label"
              exit 0
              ;;
          esac

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Blocked.** This PR changes release-critical files without declaring it." >> "$GITHUB_STEP_SUMMARY"
          echo "If the change is intended, add the \`infra-change\` label." >> "$GITHUB_STEP_SUMMARY"
          echo "If it is NOT intended, the branch is probably carrying an unmerged" >> "$GITHUB_STEP_SUMMARY"
          echo "lineage — rebase onto the target branch so the diff shows only your work." >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$HITS" | while IFS= read -r f; do
            [ -n "$f" ] && echo "::error file=${f}::release-critical path changed without the infra-change label"
          done

          echo "scope guard: BLOCKED — ${HIT_COUNT} release-critical file(s), no infra-change label"
          exit 1

# Honesty note
# ------------
# A label-based exemption is only as strong as whoever applies the label, so this
# does NOT stop a determined actor — it is not a security boundary. What it does
# stop is the failure that actually happened: infrastructure changing SILENTLY,
# as a side effect of a branch's history, while the PR title and CI both say
# something narrower. It converts an invisible diff into a deliberate one.
#
# The same honesty applies to the review receipt. The receipt lives in the PR
# BODY, which the PR author can edit, so an author who is also a trusted
# reviewer can stamp their own PR. That is not closed here, and deliberately:
# this repository has exactly one account with write access, so a rule of
# "stamper must differ from author" would be unsatisfiable — a wall, not a gate
# (hard rule 4: an executable gate needs an autonomous default). What the
# receipt DOES make impossible is the accident that happened: a BLOCK verdict
# cannot satisfy it, a receipt naming any head but the current one cannot
# satisfy it, and a verdict that was never published as a visible comment on
# this PR by a trusted author cannot satisfy it. The day a second writer exists,
# requiring a different author is a two-line change in
# scripts/drain_review_gate.py.
#
# The first version of this gate checked only that the cited comment EXISTED and
# came from a trusted author. Cross-family review 2026-09-26 got a receipt past
# it by citing an OWNER comment whose text was `VERDICT: BLOCK` for that exact
# head. Closed: the cited comment must itself attest APPROVE at the current head.
# Requiring the CURRENT head is also what closes a re-cited pre-push approval,
# and it needs no clock. Binding the comment's `created_at` against the head
# commit's date was considered and rejected — commit dates come from the
# committer's clock, and a client clock running ahead would make the gate
# unsatisfiable until real time caught up.
#
# Each receipt is read ONLY at the TOP of its text, and that is the whole
# anti-hiding rule. Three review rounds attacked a markdown scanner that tried to
# work out what GitHub renders, and each round found defects in BOTH directions:
# approvals hidden in an HTML comment, a fence, a nested <details>, a lazily
# continued blockquote, a list-nested quote; and honest receipts wrongly refused
# after a heading, after a fence marker inside an HTML block, after a literal
# <!-- in a code example. Every fix created the next round's findings, which
# AGENTS.md calls a loop, and answers with: recurring findings in one area mean
# the shape is wrong, so redesign. Nothing can precede the first line of a
# document, so a position with nothing in front of it needs no renderer. The
# scanner is gone.
