# Deploy WebSite/site (SvelteKit static) to GitHub Pages.
# Custom domain: tinyassets.io (via static/CNAME). Cloudflare fronts.
#
# RETAINED SVELTE ROLLBACK ONLY; dispatch-only. The current production source is
# WebSite/site-react and publishes manually through deploy-site-react.yml. Never
# add push or schedule triggers here: both workflows share the `pages`
# concurrency group / github-pages environment.
name: deploy-site

on:
  workflow_dispatch:
    inputs:
      refresh_snapshot:
        description: 'Rollback only — DO NOT USE until read_page is full-scope/paginated and retired live records are dispositioned (retire-cheat-loop 5.3)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebSite/site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WebSite/site/package-lock.json

      - name: Install
        run: npm ci

      # Optional rollback snapshot refresh. This workflow has no cron or push
      # trigger; production React deployments do not use this Svelte snapshot.
      - name: Refresh MCP snapshot (full)
        if: github.event.inputs.refresh_snapshot == 'true'
        env:
          MCP_BEARER: ${{ secrets.MCP_BEARER }}
          SNAPSHOT_FULL: '1'
          SNAPSHOT_REQUIRED: '1'
        run: npm run snapshot

      - name: Test snapshot retirement invariants
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebSite/site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
