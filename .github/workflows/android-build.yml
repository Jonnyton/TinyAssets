name: Android debug APK

# Builds a sideloadable debug APK on GitHub's runners (JDK 17 + Android SDK
# pre-installed) and uploads it as an artifact. Download it from the run's
# Artifacts, transfer to an Android phone, enable "install unknown apps", and
# open it — no local Android Studio / keystore / Play account needed to TRY it.
# (The signed release .aab for Play is a separate, keystore-signed build — see
# mobile/README.md.)

on:
  push:
    branches: [main, feat/android-app]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

# contents: write � a build from `main` replaces the APK on the latest GitHub
# release, which is what the website's "Get the Android app" button downloads
# (releases/latest/download/app-debug.apk).
permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS deps
        working-directory: mobile
        run: npm install

      - name: Add + sync Android platform
        working-directory: mobile
        run: |
          npx --yes cap add android
          npx --yes cap sync android

      - name: Register the tinyassets:// deep link (in-app OAuth return)
        working-directory: mobile
        run: |
          python3 scripts/add_app_scheme.py
          grep -n 'android:scheme="tinyassets"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyassets-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the latest release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            tag="android-latest"
            gh release create "$tag" --title "TinyAssets Android (debug)" --notes "Sideloadable debug build from main. The website's Get-the-Android-app button downloads this asset."
          fi
          gh release upload "$tag" mobile/android/app/build/outputs/apk/debug/app-debug.apk --clobber
          echo "published app-debug.apk to release $tag"
