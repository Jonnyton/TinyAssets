name: Retag immutable recovery image

# Manual recovery-only workflow. Its distinct workflow name is a trust
# boundary: deploy-prod subscribes only to successful Build and publish image
# runs, so retagging an older admitted digest cannot start an ordinary deploy.

on:
  workflow_dispatch:
    inputs:
      source_digest:
        description: 'Existing immutable digest to retag for recovery'
        required: true
        type: string
      source_revision:
        description: 'Exact 40-character source revision recorded on the recovery image'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: recovery-retag-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tinyassets-daemon

jobs:
  retag:
    name: Retag recorded immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag recorded immutable image
        env:
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          digest="${SOURCE_DIGEST}"
          revision="${SOURCE_REVISION}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::source_digest must be a canonical sha256 digest"
            exit 1
          fi
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_revision must be a full lowercase commit SHA"
            exit 1
          fi
          image="${REGISTRY}/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}"
          docker pull "${image}@${digest}" >/dev/null
          observed_revision="$(
            docker image inspect "${image}@${digest}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )"
          [[ "${observed_revision}" == "${revision}" ]] || {
            echo "::error::source digest revision label disagrees with source_revision"
            exit 1
          }
          git fetch --no-tags origin "${revision}"
          git cat-file -e "${revision}^{commit}"
          docker buildx imagetools create --prefer-index=false --tag "${image}:${revision:0:12}" "${image}@${digest}"
          retagged_digest="$(
            docker buildx imagetools inspect "${image}:${revision:0:12}" |
              awk '/^Digest:/ {print $2; exit}'
          )"
          [[ "${retagged_digest}" == "${digest}" ]] || {
            echo "::error::retagged digest disagrees with immutable source"
            exit 1
          }
