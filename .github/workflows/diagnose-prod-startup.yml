name: Diagnose production startup journal

on:
  workflow_dispatch:
    inputs:
      since_utc:
        description: 'Inclusive UTC start (YYYY-MM-DDTHH:MM:SSZ)'
        required: true
        type: string
      until_utc:
        description: 'Inclusive UTC end (YYYY-MM-DDTHH:MM:SSZ; max 10m)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-host-observation
  cancel-in-progress: false

env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify secrets and bounded past window
        env:
          SINCE_UTC: ${{ inputs.since_utc }}
          UNTIL_UTC: ${{ inputs.until_utc }}
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DO_DROPLET_HOST}" ]
          [ -n "${DO_SSH_USER}" ]
          [ -n "${SSH_KEY}" ]
          python - <<'PY'
          import datetime
          import os
          import re

          pattern = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z")
          values = [os.environ["SINCE_UTC"], os.environ["UNTIL_UTC"]]
          if not all(pattern.fullmatch(value) for value in values):
              raise SystemExit("diagnostic timestamps must be strict UTC seconds")
          start, end = (
              datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              for value in values
          )
          if end <= start:
              raise SystemExit("diagnostic window end must follow start")
          if end - start > datetime.timedelta(minutes=10):
              raise SystemExit("maximum diagnostic window is 10 minutes")
          if end > datetime.datetime.now(datetime.UTC):
              raise SystemExit("diagnostic window must be in the past")
          PY

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "${DO_DROPLET_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Classify bounded historical unit journal
        env:
          SINCE_UTC: ${{ inputs.since_utc }}
          UNTIL_UTC: ${{ inputs.until_utc }}
        run: |
          set +e
          diagnosis="${RUNNER_TEMP}/startup-journal-diagnosis.json"
          timeout 35s ssh -i ~/.ssh/do_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" \
              "timeout 25s sudo journalctl -u tinyassets-daemon --since '${SINCE_UTC}' --until '${UNTIL_UTC}' --no-pager --output=cat --lines=500" \
              2>/dev/null \
            | tail -c 262145 \
            | python scripts/sanitize_systemd_startup_diagnostics.py \
                > "${diagnosis}"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ] \
              || [ "${statuses[1]}" -ne 0 ] \
              || [ "${statuses[2]}" -ne 0 ]; then
            echo "::error::bounded journal diagnosis failed"
            exit 1
          fi
          cat "${diagnosis}"
