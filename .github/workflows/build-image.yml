name: Build and publish image

# Self-host migration Row I:
# publish the daemon image Row D deploys, while docker-build.yml remains
# the PR/push smoke test that proves the Dockerfile still boots.

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'PLAN.md'
      - 'tinyassets/**'
      - 'domains/**'
      - 'fantasy_daemon/**'
      - 'data/world_rules.lp'
      - 'scripts/mcp_public_canary.py'
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      source_digest:
        description: 'Existing immutable digest to retag for recovery (requires source_revision)'
        required: false
        type: string
      source_revision:
        description: 'Exact 40-character source revision recorded on the recovery image'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  # A newer push supersedes stale work. A manual recovery build waits instead
  # of cancelling the push build that may already be converging production.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tinyassets-daemon

jobs:
  build-and-push:
    name: Build and push GHCR image
    # Auto-build on main pushes; allow a manual workflow_dispatch from any ref so
    # a specific branch image can be built + deployed via deploy-prod (image input)
    # without first merging the branch to main.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Derive GHCR tags
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          short_sha="$(git rev-parse --short=12 HEAD)"

          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "${image}:${short_sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag recorded immutable image
        if: inputs.source_digest != '' || inputs.source_revision != ''
        env:
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          digest="${SOURCE_DIGEST}"
          revision="${SOURCE_REVISION}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::source_digest must be a canonical sha256 digest"
            exit 1
          fi
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_revision must be a full lowercase commit SHA"
            exit 1
          fi
          image="${REGISTRY}/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}"
          docker pull "${image}@${digest}" >/dev/null
          observed_revision="$(
            docker image inspect "${image}@${digest}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )"
          [[ "${observed_revision}" == "${revision}" ]] || {
            echo "::error::source digest revision label disagrees with source_revision"
            exit 1
          }
          git cat-file -e "${revision}^{commit}"
          docker buildx imagetools create --tag "${image}:${revision:0:12}" "${image}@${digest}"
          retagged_digest="$(
            docker buildx imagetools inspect "${image}:${revision:0:12}" |
              awk '/^Digest:/ {print $2; exit}'
          )"
          [[ "${retagged_digest}" == "${digest}" ]] || {
            echo "::error::retagged digest disagrees with immutable source"
            exit 1
          }

      - name: Build and push image
        if: inputs.source_digest == '' && inputs.source_revision == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.short_sha }}
          cache-from: type=gha,scope=tinyassets-daemon
          cache-to: type=gha,mode=max,scope=tinyassets-daemon

      - name: Publish image summary
        if: inputs.source_digest == '' && inputs.source_revision == ''
        run: |
          {
            echo "Published image:"
            echo "- ${{ steps.image.outputs.image }}:${{ steps.image.outputs.short_sha }}"
          } >> "${GITHUB_STEP_SUMMARY}"
