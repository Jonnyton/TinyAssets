name: Queue freshness

# When main moves, find queued or armed PRs that no longer merge with it --
# textually, or in a test both sides can affect -- and take them out BEFORE
# their merge group fails and every group behind it rebuilds
# (scripts/queue_freshness.py). Measured 24 h to 2026-10-02: 241 merge-group
# Tests runs for 76 merges, 99 failed.
#
# Two jobs on purpose. `probe` runs PR code (pytest on the merged tree) with a
# read-only token, and the script strips even that from the test process.
# `act` holds the write token, checks out only the default branch, never runs
# PR code, and acts only on a head that has not moved since the probe.
#
# Not a required check and not a gate: it only spares the queue a doomed group.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One probe at a time and at most one waiting: a newer push replaces the
  # pending run, never cancels the running one (which would lose its verdicts).
  group: queue-freshness
  cancel-in-progress: false

jobs:
  probe:
    name: queue-freshness probe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Probe queued and armed PRs against current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-fresh
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          python scripts/queue_freshness.py probe --repo "$REPO" --out "$RUNNER_TEMP/verdicts.json"

      - uses: actions/upload-artifact@v4
        with:
          name: queue-freshness-verdicts
          path: ${{ runner.temp }}/verdicts.json

  act:
    name: queue-freshness act
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: queue-freshness-verdicts
          path: ${{ runner.temp }}

      - name: Dequeue and ping PRs that went stale
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python scripts/queue_freshness.py act --repo "$REPO" --verdicts "$RUNNER_TEMP/verdicts.json"
