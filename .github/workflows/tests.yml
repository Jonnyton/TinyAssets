name: Tests

# Why this exists
# ---------------
# Until this workflow landed, NEITHER required status check on `main` tested code
# behaviour:
#
#   * `policy` (daemon-request-policy.yml) only reads writer:/checker: labels. A
#     PR carrying none of them passes it trivially.
#   * `Diff scope declared` (pr-scope-guard.yml) is a scope-DECLARATION gate and
#     says so in its own honesty note.
#
# Since the repo auto-merges any non-draft PR once required checks pass, and
# merges flow on to production, code could reach live users without a single
# behavioural gate. This workflow is that gate.
#
# MUST run unconditionally — no `paths:` filter, no job-level `if:`.
# A REQUIRED status check that is path-filtered never reports at all on PRs
# outside those paths, and the PR then hangs forever on "Expected — waiting for
# status". That is why `lint`/actionlint is path-filtered and must NEVER be made
# required. Every `exit` path below produces a conclusion for the same check name.

on:
  pull_request:
    # No `paths:` — see above. Drafts get `opened`/`synchronize` too, so the gate
    # gives signal before a PR is marked ready and becomes auto-merge eligible.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  # The post-merge tripwire's only reliable AUTOMATIC trigger on this repo.
  # (`workflow_dispatch` below is also non-PR, but it needs a human to press it,
  # so it cannot carry a tripwire. Stated precisely because the first draft of
  # this comment claimed push was the only non-PR trigger, which is false.)
  #
  # `push: branches: [main]` looks like it covers every merge. It does not:
  # auto-enroll-merge.yml enrols each PR with the repo's GITHUB_TOKEN, so
  # GitHub performs the merge as `app/github-actions`, and events raised by
  # GITHUB_TOKEN never start a workflow run (AGENTS.md hard rule 14, "Merged is
  # not deployed"). Measured 2026-08-03: of the last 6 merges, the 5 done by the
  # app produced ZERO push runs; only #2191, merged by a human PAT, produced one.
  # So `push` fires on the rare human merge and never on the normal path — the
  # tripwire read as coverage while providing none, the same failure shape as the
  # concurrency bug fixed above.
  #
  # `schedule` is used because it is the one trigger empirically proven to fire
  # here (26 of the last 200 runs). Runners are free on a public repo, so the
  # cadence is chosen for detection latency, not cost.
  #
  # It is BEST-EFFORT. The cron declares NOMINAL SLOTS, not a delivered rate:
  # GitHub drops scheduled runs under load. Measured on this repo 2026-08-03,
  # release-reconcile declares `*/15 * * * *` (96 runs/day) and actually fired
  # 16 in 24h — a 6x shortfall, with one 3h47m gap. So read the cron below as a
  # declaration of one nominal slot per hour, not a promise about how many
  # runs arrive or how far apart they land. That is acceptable
  # for a
  # tripwire whose alternative is never running at all; it would NOT be
  # acceptable for a merge gate, which is why `required-tests` is REQUIRED only
  # via `pull_request`, where the trigger is deterministic.
  #
  # Accepted side effect: `required-tests` and `slow-tests` have no job-level
  # `if:`, so they run on the schedule too. `full-tests` is a strict superset of
  # `required-tests`, so that is duplicated work. It is deliberate — runners are
  # free here, and the alternative is a job-level `if:` on the REQUIRED job.
  #
  # That would fail OPEN, not closed. A skipped job reports
  # `conclusion=skipped`, and branch protection accepts a skipped required check
  # as satisfied — so a condition that was wrong in some edge case would merge
  # untested code silently. (Verified empirically 2026-08-03: `full-tests`
  # reported COMPLETED/SKIPPED on PR #2197, not pending. An earlier draft of
  # this comment claimed a job-level `if:` would strand PRs on "Expected"; that
  # is the behaviour of a *trigger-level* `paths:` filter, not a job `if:`, and
  # cross-family review corrected it.)
  #
  # Wasting a free runner is the cheaper failure than a required check that can
  # quietly pass without running.
  #
  # WHY HOURLY. `17 */3` declared 8 slots/day; this declares 24. That is a
  # change to what the repo DECLARES. GitHub documents that scheduled events
  # may be delayed or dropped and specifies no relationship between declared
  # and delivered rate, so the delivered effect is unknown and is to be
  # measured rather than assumed:
  #
  #     gh run list --workflow tests.yml --event schedule
  #
  # WHY NOT TIGHTER. `full-tests` measured 36 and 38 minutes, and non-PR runs
  # get a unique concurrency group (`github.run_id`) with cancel-in-progress
  # false. Whatever GitHub delivers, this workflow's own concurrency policy
  # will not replace one non-PR run with another; it does not follow that two
  # runs execute simultaneously, since runner capacity may serialize them. A
  # declared interval shorter than the job's runtime is therefore a policy
  # this file declines to adopt, not a prediction about what would happen.
  #
  # A fixed minute is therefore a policy about the DECLARATION only, pinned by
  # test_schedule_declares_at_most_one_nominal_slot_per_hour. Nothing here
  # claims runs cannot overlap: two nominally-hourly slots can be dispatched
  # minutes apart — the two runs above arrived 59 and 17 minutes after theirs.
  # Overlap is tolerated, not prevented: runners are free on a public repo, so
  # duplicated tripwire work costs nothing and corrupts nothing.
  #
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# `pull_request`, deliberately NOT `pull_request_target`: testing a PR means
# EXECUTING the PR's code, so it must run in the untrusted-by-default context
# where the token is read-only and secrets are withheld. The scope guard uses
# _target for the opposite reason — it only reads metadata and must not be
# editable by the PR it judges.
permissions:
  contents: read

concurrency:
  # PRs cancel superseded runs (only the latest head matters). Non-PR runs are
  # keyed per-RUN and never collide at all: grouping them by ref meant each push
  # killed the previous main run, so with a commit every ~10 min the post-merge
  # tripwire almost never finished — it looked like coverage while providing
  # none (found in cross-family review 2026-08-03).
  #
  # `run_id` rather than `sha`, per a second review round: keying by SHA still
  # collides when several scheduled runs land on an UNCHANGED main, and GitHub
  # replaces an existing *pending* run with a newer one — so a queued tripwire
  # run can be silently dropped. run_id makes every
  # non-PR run unique, so THIS workflow's concurrency policy has nothing to
  # replace — GitHub may still drop a queued job under load, which is a
  # separate mechanism this key cannot address.
  # cancel-in-progress stays conditional as defence in depth.
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-tests:
    # This exact string is the branch-protection context. Renaming the job
    # ORPHANS the old required context: it stays "Expected — waiting for
    # status" forever and every PR blocks indefinitely (it does NOT fail open;
    # corrected 2026-08-02 per Codex review). Change the name only together
    # with the `gh api` protection update in
    # docs/decisions/ADR-003-required-test-aggregator.md.
    name: required-tests
    runs-on: ubuntu-latest
    # 30 was measured against the 2026-07-22 suite (25:48) and the suite has
    # since outgrown it — run 30766011005 was killed at exactly 30:15 with the
    # tests still going. 50 buys headroom for one honest full measurement; the
    # ADR documents the fast-subset escape hatch if the latency bites.
    timeout-minutes: 50

    steps:
      # fetch-depth 0: the docs-only gate below needs both sides of the diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DOCS-ONLY FAST PATH.
      #
      # 9 of the last 25 merged PRs changed ZERO executable files and still ran
      # all ~13,000 tests. That is the "evaluate the candidate, not the
      # universe" waste AVO's scoring loop avoids.
      #
      # EARLY EXIT INSIDE THE JOB, deliberately not a `paths:` filter: a
      # path-filtered required check never reports and the PR then hangs on
      # "Expected -- waiting for status" forever (see the header). The job runs
      # and succeeds; only the install and pytest steps are conditional.
      #
      # The inert set is deliberately TINY. Cross-family review rejected a
      # broader one and named three escapes, all closed here:
      #
      #   * `--no-renames`. Plain `git diff --name-only` reports only a
      #     rename's DESTINATION, so `scripts/foo.py` -> `docs/foo.md` looked
      #     docs-only while executable code vanished.
      #   * `.txt` is NOT inert. `.github/known-failing-tests.txt` and
      #     `.github/heavy-test-files.txt` DEFINE the gate; a ledger-only PR
      #     would have skipped the very job that ratchets the ledger.
      #   * Only `docs/**/*.md` counts, never a root or `.github/` markdown
      #     file. `tests/smoke/test_plan_md_exists.py` asserts `AGENTS.md` and
      #     `PLAN.md` EXIST, so deleting one is a .md-only change that must
      #     still run the test written to catch it.
      #
      # Fails OPEN toward running: non-PR events, a failed diff, an empty diff,
      # and anything not matching the inert pattern all fall through.
      - name: Decide whether any executable file changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "not a PR - running everything"; exit 0
          fi
          if ! git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "diff failed - running everything"; exit 0
          fi
          if [ ! -s /tmp/changed.txt ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "empty diff - running everything"; exit 0
          fi
          # INERT = documentation prose and images under docs/ only.
          INERT='^(docs/.*\.(md|rst)|docs/.*\.(png|jpg|jpeg|gif|svg|webp|ico))$'
          if grep -qvE "$INERT" /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "executable or gate-defining files changed - running the suite:"
            grep -vE "$INERT" /tmp/changed.txt | head -20
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only PR - skipping the suite:"; cat /tmp/changed.txt
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run the required test surface
        if: steps.scope.outputs.code == 'true'
        env:
          # Keep the suite off the real repo tree and off any host state. The
          # conftest already forces mock providers and sqlite_only storage; this
          # is belt-and-braces for anything that reads the env directly.
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          # The script owns the pytest invocation AND the pass/fail decision:
          # it fails on any failure not listed in .github/known-failing-tests.txt.
          # No `|| true`, no `continue-on-error` — its exit code IS the gate.
          #
          # --exclude-from drops the 47 files holding ~90% of the wall clock,
          # taking this from ~37 min to ~4. That matters because `strict`
          # protection requires a PR to be up to date at merge time and main
          # takes a commit every ~10 min: at 37 min only 5% of gaps are long
          # enough to land anything, which would wedge every merge including
          # the drain. At ~4 min, 79% are.
          #
          # Excluding them was VERIFIED safe, not assumed: every failure the
          # exclusion run reported was also failing in the same-tree full run.
          # The excluded files still run in `full-tests`, on a best-effort
          # schedule of one nominal slot per hour — NOT "on every main push", which was
          # the original claim here and was wrong: app-performed merges raise no
          # push event. See the `schedule:` trigger comment.
          python scripts/ci_required_tests.py --junit junit.xml \
            --exclude-from .github/heavy-test-files.txt \
            --min-ran 10700

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-required-tests
          path: junit.xml
          if-no-files-found: warn

  # The other half of the split: the COMPLETE surface, on a best-effort
  # schedule (one nominal slot per hour; delivered count and spacing are
  # unspecified — see the `schedule:` trigger comment).
  # NOT required — this is the post-merge tripwire, not the merge gate. It
  # exists because `required-tests` deliberately trades coverage for a wall
  # clock that fits main's commit cadence; without this the excluded files
  # would have no CI at all. Same quarantine ledger, so a failure here is a
  # real regression rather than baseline noise.
  #
  # `github.event_name != 'pull_request'` therefore admits schedule, push and
  # workflow_dispatch — schedule is what actually carries it (see above).
  full-tests:
    name: full-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run the complete test surface
        env:
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-full
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          # No --exclude-from: this is everything.
          python scripts/ci_required_tests.py --junit junit-full.xml --min-ran 12800
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-full-tests
          path: junit-full.xml
          if-no-files-found: warn

  # NOT a required check (yet). The repo's `slow` marker guards stress/race
  # tests, and `required-tests` deselects them to stay fast — which left the 9
  # concurrency tests in test_activity_log_parity.py and test_node_bid_claim_stress.py
  # with NO CI runner at all, against an AGENTS.md rule that uptime work ships
  # with a concurrency/load proof. This job gives them one. It is reported but
  # not required until it has a clean track record, because stress tests are the
  # likeliest source of flake and a flaky REQUIRED check trains people to
  # re-run until green — which is how a gate stops meaning anything.
  slow-tests:
    name: slow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run slow/stress/race tests
        env:
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-slow
        run: |
          mkdir -p "$TINYASSETS_DATA_DIR"
          # Serial on purpose: these assert cross-process/locking behaviour and
          # sharing a worker pool with them would test the pool, not the code.
          # Both ignores are tray imports that die at COLLECTION on a headless
          # runner (Xlib "Bad display name") and take the whole job down with
          # an Interrupted — required-tests survives the same files only via
          # --continue-on-collection-errors.
          pytest -m slow -q --no-header -rfE --durations=10 \
            --ignore=tests/test_tinyassets_tray.py \
            --ignore=tests/desktop_install/test_packaged_runtime.py
