name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: SSH settle systemd
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy; chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          C="docker compose --env-file /etc/tinyassets/env -f /opt/tinyassets/compose.yml"
          echo "===== reset-failed + start (attach to running stack, no stop) ====="
          systemctl reset-failed tinyassets-daemon.service 2>&1
          systemctl start tinyassets-daemon.service 2>&1 &
          sleep 45
          echo "===== systemd state ====="; systemctl show tinyassets-daemon.service -p ActiveState -p SubState -p NRestarts 2>&1
          echo "===== SAFETY NET: ensure stack up ====="; $C up -d 2>&1 | tail -5
          sleep 8
          echo "===== ps ====="; docker ps --format '{{.Names}} {{.Status}}' | grep -E "daemon|tunnel"
          echo "===== enable on boot ====="; systemctl is-enabled tinyassets-daemon.service 2>&1
          echo "===== DONE ====="
          REMOTE
