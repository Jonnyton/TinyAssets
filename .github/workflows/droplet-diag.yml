name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: SSH probe compose failure
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          echo "===== TINYASSETS_IMAGE ====="; grep -E '^TINYASSETS_IMAGE=' /etc/tinyassets/env
          echo "===== is that image present locally? ====="; docker images --digests --format '{{.Repository}}@{{.Digest}} ({{.Size}})' 2>&1 | grep -i tinyassets | head
          echo "===== compose config valid? ====="; docker compose --env-file /etc/tinyassets/env -f /opt/tinyassets/compose.yml config 2>&1 | head -3; echo "config rc=$?"
          echo "===== MANUAL: docker compose up -d (the exact 125 error) ====="; docker compose --env-file /etc/tinyassets/env -f /opt/tinyassets/compose.yml up -d 2>&1 | tail -25; echo "up rc=$?"
          echo "===== docker ps after ====="; docker ps --format '{{.Names}} | {{.Status}}' 2>&1 | head
          echo "===== local probe ====="; sleep 8; curl -s -o /dev/null -w "localhost:8001/mcp -> %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{}' http://localhost:8001/mcp 2>&1
          echo "===== DONE ====="
          REMOTE
