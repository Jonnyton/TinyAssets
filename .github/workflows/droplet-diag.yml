name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: SSH find compose plugin + home
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy; chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          echo "===== tinyassets passwd ====="; getent passwd tinyassets
          echo "===== HOME when run as tinyassets (sudo) ====="; sudo -u tinyassets sh -c 'echo HOME=$HOME; ls -la $HOME/.docker/cli-plugins/ 2>&1 | head'
          echo "===== find docker-compose plugin ====="; find /usr /home /root /app /var/lib -maxdepth 6 -name 'docker-compose*' -path '*cli-plugins*' 2>/dev/null | head
          echo "===== systemd exec HOME (what the unit sees) ====="; systemctl show tinyassets-daemon.service -p Environment 2>&1
          echo "===== DONE ====="
          REMOTE
