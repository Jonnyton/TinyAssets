name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  why:
    runs-on: ubuntu-latest
    steps:
      - name: SSH why up -d fails under systemd
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy; chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          echo "===== journalctl (systemd up -d error) ====="; journalctl -u tinyassets-daemon.service -n 30 --no-pager 2>&1 | grep -ivE "ENV-UNREADABLE|password" | tail -30
          echo "===== reproduce ExecStart AS tinyassets user ====="; sudo -u tinyassets /usr/bin/docker compose --env-file /etc/tinyassets/env -f /opt/tinyassets/compose.yml up -d --remove-orphans 2>&1 | tail -15; echo "rc=$?"
          echo "===== DONE ====="
          REMOTE
