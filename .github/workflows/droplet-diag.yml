name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: SSH recover daemon service
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          echo "===== WHY IT FAILED (journalctl) ====="; journalctl -u tinyassets-daemon.service -n 45 --no-pager 2>&1 | tail -45
          echo "===== RESET + RESTART ====="; systemctl reset-failed tinyassets-daemon.service 2>&1; systemctl restart tinyassets-daemon.service 2>&1; echo "restart rc=$?"
          echo "waiting 50s for stack..."; sleep 50
          echo "===== STATUS AFTER ====="; systemctl status tinyassets-daemon.service --no-pager 2>&1 | head -12
          echo "===== DOCKER PS ====="; docker ps --format '{{.Names}} | {{.Status}}' 2>&1 | head
          echo "===== LOCAL DAEMON PROBE ====="; curl -s -o /dev/null -w "localhost:8001/mcp -> %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"p","version":"1"}}}' http://localhost:8001/mcp 2>&1
          echo "===== FRESH DAEMON LOGS (post-restart) ====="; docker logs tinyassets-daemon --tail 30 2>&1 | tail -30
          echo "===== DONE ====="
          REMOTE
