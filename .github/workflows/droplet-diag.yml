name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnostics
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy
          chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          echo "===== UPTIME (did droplet reboot?) ====="; uptime; echo "boot: $(who -b 2>/dev/null)"
          echo "===== RESTART POLICIES ====="; for c in tinyassets-daemon tinyassets-tunnel tinyassets-logs; do echo "$c: $(docker inspect --format '{{.HostConfig.RestartPolicy.Name}} status={{.State.Status}} exit={{.State.ExitCode}} finishedAt={{.State.FinishedAt}}' $c 2>&1)"; done
          echo "===== DAEMON LOGS (last 100) ====="; docker logs tinyassets-daemon --tail 100 2>&1 | tail -100
          echo "===== COMPOSE FILE ====="; ls -la /opt/tinyassets/compose.yml /etc/tinyassets/*.yml 2>&1 | head
          echo "===== systemd unit? ====="; systemctl list-units --type=service 2>/dev/null | grep -iE "tinyassets|docker" | head
          echo "===== DONE ====="
          REMOTE
