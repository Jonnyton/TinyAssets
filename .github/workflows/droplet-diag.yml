name: Droplet diagnostics
on: { workflow_dispatch: {} }
permissions: { contents: read }
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  envtest:
    runs-on: ubuntu-latest
    steps:
      - name: SSH empirical env test
        env: { SSH_KEY: "${{ secrets.DO_SSH_KEY }}" }
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy; chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          F="--env-file /etc/tinyassets/env -f /opt/tinyassets/compose.yml"
          echo "A minimal+HOME:";        sudo -u tinyassets env -i HOME=/opt/tinyassets /usr/bin/docker compose $F config >/dev/null 2>/tmp/a; echo "  rc=$? $(tail -1 /tmp/a)"
          echo "B +PATH:";               sudo -u tinyassets env -i HOME=/opt/tinyassets PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/docker compose $F config >/dev/null 2>/tmp/b; echo "  rc=$? $(tail -1 /tmp/b)"
          echo "C +DOCKER_CONFIG:";       sudo -u tinyassets env -i HOME=/opt/tinyassets DOCKER_CONFIG=/opt/tinyassets/.docker /usr/bin/docker compose $F config >/dev/null 2>/tmp/c; echo "  rc=$? $(tail -1 /tmp/c)"
          echo "D +PATH+DOCKER_CONFIG:";  sudo -u tinyassets env -i HOME=/opt/tinyassets PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG=/opt/tinyassets/.docker /usr/bin/docker compose $F config >/dev/null 2>/tmp/d; echo "  rc=$? $(tail -1 /tmp/d)"
          echo "===== DONE ====="
          REMOTE
