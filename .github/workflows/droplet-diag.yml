name: Droplet diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DO_DROPLET_HOST: ${{ secrets.DO_DROPLET_HOST }}
  DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
jobs:
  stab:
    runs-on: ubuntu-latest
    steps:
      - name: SSH stability check + settle systemd
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; printf '%s' "$SSH_KEY" > ~/.ssh/do_deploy; chmod 600 ~/.ssh/do_deploy
          ssh-keyscan -t ed25519,rsa "$DO_DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/do_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${DO_SSH_USER}@${DO_DROPLET_HOST}" bash -s <<'REMOTE'
          set +e
          echo "===== systemd status ====="; systemctl is-active tinyassets-daemon.service; systemctl show tinyassets-daemon.service -p NRestarts -p ActiveState -p SubState 2>&1
          echo "===== container uptime (flapping?) sample 1 ====="; docker ps --format '{{.Names}} {{.Status}}' | grep daemon
          sleep 20
          echo "===== sample 2 (20s later — uptime should INCREASE, not reset) ====="; docker ps --format '{{.Names}} {{.Status}}' | grep daemon
          echo "===== daemon restart count ====="; docker inspect --format 'restarts={{.RestartCount}} started={{.State.StartedAt}}' tinyassets-daemon 2>&1
          echo "===== ExecStart line ====="; grep ExecStart /etc/systemd/system/tinyassets-daemon.service
          echo "===== DONE ====="
          REMOTE
