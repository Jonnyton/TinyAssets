name: Release reconcile regression

on:
  pull_request:
    paths:
      - '.github/workflows/build-image.yml'
      - '.github/workflows/release-reconcile.yml'
      - '.github/workflows/release-reconcile-regression.yml'
      - 'tests/test_build_image_workflow.py'
      - 'tests/test_release_reconcile_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-image.yml'
      - '.github/workflows/release-reconcile.yml'
      - '.github/workflows/release-reconcile-regression.yml'
      - 'tests/test_build_image_workflow.py'
      - 'tests/test_release_reconcile_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-reconcile-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # release-reconcile.yml uses the system python3 on ubuntu-24.04. Pin the
      # same minor version here so embedded-script syntax cannot silently pass
      # only on a more permissive developer interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install -e . pytest pyyaml

      - name: Run release workflow contracts
        run: >-
          python -m pytest
          tests/test_build_image_workflow.py
          tests/test_release_reconcile_workflow.py
          -q
