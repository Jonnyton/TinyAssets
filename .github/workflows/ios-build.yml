name: iOS build

# Compile-checks the iOS Capacitor app on a macOS runner (Xcode + CocoaPods
# pre-installed). Like the web app, product logic lives in the live SPA the shell
# wraps, so a new build is only needed when the native shell/config changes.
#
# This builds UNSIGNED for the simulator to verify the project compiles — no
# Apple credentials required. A signed .ipa for TestFlight / App Store is a
# separate step that needs the founder's Apple Developer signing assets
# (certificate + provisioning profile) and App Store Connect API key; see
# docs/ops/app-store-launch.md. Mirrors android-build.yml's read-only shape.

on:
  workflow_dispatch:
  push:
    branches: [main, feat/ios-app]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps (lockfile-pinned)
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add + sync iOS platform
        working-directory: mobile
        run: |
          npx --no-install cap add ios
          npx --no-install cap sync ios

      - name: Register the tinyassets:// URL scheme (in-app OAuth return)
        working-directory: mobile
        run: |
          python3 scripts/add_ios_scheme.py
          grep -q "<string>tinyassets</string>" ios/App/App/Info.plist

      # The release workflow depends on this script producing a catalog Xcode
      # accepts, but ios-release.yml only runs on dispatch or a tag — and cannot
      # run at all until the Apple account exists. Running it here means the parse,
      # the sips resizes and the byte-exact 1024 copy are proven on a real macOS
      # runner against a real Capacitor project on every PR, instead of first
      # finding out during a release.
      - name: Write the app icon catalog (same script the release build uses)
        working-directory: mobile
        run: bash scripts/write_app_icon_catalog.sh

      - name: Compile-check (unsigned, simulator)
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          # Capacitor 8 wires plugins through Swift Package Manager whenever
          # every plugin ships a Package.swift, so `cap sync ios` writes
          # Package.swift and never runs `pod install` -- there is no
          # .xcworkspace to build. Prefer the project, and fall back to a
          # workspace only if a CocoaPods integration reappears.
          target=(-project App.xcodeproj)
          if [ -d App.xcworkspace ]; then target=(-workspace App.xcworkspace); fi
          xcodebuild \
            "${target[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40
