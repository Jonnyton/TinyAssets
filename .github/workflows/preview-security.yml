# Unfiltered required-check candidate for the trusted preview boundary.
#
# `preview-worker.yml` remains path-filtered so unrelated pull requests do not
# build/upload a site artifact. This small job runs on every pull request so
# validator or workflow regressions always produce a check that branch
# protection can require.
name: preview-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Preview trust-boundary contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run preview trust-boundary contracts
        working-directory: WebSite/site-react
        run: |
          npm ci
          npm test
