name: linux-jail-proof

# Why this exists
# ---------------
# Some proofs only mean anything inside a real bubblewrap jail, and every one
# of them is `skipif`-gated on bwrap. No other job installs bubblewrap, so
# `required-tests` records them as SKIPPED on every run. A skip is invisible in
# a green run and is not evidence in either direction. The guarded cases:
#
#   * tests/test_delivery_node_rpc.py::test_real_linux_jail_transports_delivery_rpc
#     runs the file-delivery RPC through the real jail
#     (tinyassets/node_sandbox.py BwrapLauncher);
#   * tests/test_native_refresh_jail.py runs the argv the shipping codex
#     provider builds for a coding turn (tinyassets/providers/codex_provider.py)
#     and proves the launch-credential mask holds, with a detection control;
#   * tests/test_provider_universe_jail.py runs the shipping claude and codex
#     adapters, and a jail-unaware command adapter through the router, inside
#     the shared provider jail (tinyassets/providers/provider_jail.py) and
#     proves a launch for universe A reads A but not universe B, the platform
#     source, another launch's credential or any outside process environment;
#   * tests/test_universe_tools_jail.py drives the universe agent's four tools
#     (tinyassets/universe_tools.py, served by tinyassets/engine_mcp_server.py)
#     through the real tool jail and proves: only its own universe at /u, no
#     network, no planted link or FIFO, a settings dir it writes masked from
#     the next provider launch, resource limits that kill a runaway
#     (memory, processes / fork bomb, cpu, output, wall clock, shared disk), and
#     that a skill file the agent writes changes its next served turn.
#
# This job supplies the jail on a disposable GitHub-hosted Ubuntu VM and FAILS
# unless EVERY named case is present in JUnit with no skip, failure or error.
# It is cloud-only test infrastructure: no deployment, no production surface,
# no account secrets, no self-hosted runner, never the founder's desktop.
#
# It is deliberately NOT a branch-protection context. `required-tests` in
# tests.yml remains the merge gate; this is the independent Linux proof for the
# file-delivery, codex coding-turn and provider-universe jail slices, read by
# a human before a "proven live" claim.
#
# Hardening it does NOT do, on purpose: no `sysctl` relaxation of
# kernel.apparmor_restrict_unprivileged_userns, no AppArmor profile edits, no
# privileged daemon. If the hosted image refuses an unprivileged user
# namespace, the same hermetic test runs once under `sudo -n` with the exact
# setup-python interpreter on the throwaway VM — and if that also cannot jail,
# the job is red, not skipped.

on:
  pull_request:
    paths:
      # This job and its assertion helper.
      - ".github/workflows/linux-jail-proof.yml"
      - "scripts/ci_assert_junit_case.py"
      # The jail and the runtime that drives delivery RPC through it.
      - "tinyassets/node_sandbox.py"
      - "tinyassets/graph_compiler.py"
      - "tinyassets/runs.py"
      - "tinyassets/engine_admissions.py"
      - "tinyassets/delivery_runtime.py"
      - "tinyassets/action_result_delivery.py"
      - "tinyassets/conversation_custody.py"
      - "tinyassets/run_file_*.py"
      # Delivery / receiver / file custody API and storage.
      - "tinyassets/api/deliveries.py"
      - "tinyassets/api/receiver_links.py"
      - "tinyassets/api/run_files.py"
      - "tinyassets/storage/deliveries.py"
      - "tinyassets/storage/delivery_lock.py"
      - "tinyassets/storage/receiver_links.py"
      - "tinyassets/storage/run_files.py"
      - "tinyassets/storage/run_file_lock.py"
      - "tinyassets/storage/conversation_custody.py"
      # The module under proof and the fixtures it imports.
      - "tests/test_delivery_node_rpc.py"
      - "tests/test_delivery_public.py"
      - "tests/test_receiver_links.py"
      - "tests/conftest.py"
      # The codex coding-turn jail proof, the provider whose argv it runs, and
      # the governed agent-invocation path that launches that provider.
      - "tests/test_native_refresh_jail.py"
      - "tinyassets/providers/codex_provider.py"
      - "tinyassets/agent_runtime_provider_execution.py"
      # The provider universe jail, the shared spawn point that applies it, the
      # router that binds the owning universe, the adapters it launches and the
      # environment builder whose paths must resolve inside it.
      - "tests/test_provider_universe_jail.py"
      - "tinyassets/providers/provider_jail.py"
      - "tinyassets/providers/owned_process.py"
      - "tinyassets/providers/router.py"
      - "tinyassets/providers/claude_provider.py"
      - "tinyassets/providers/base.py"
      # The universe agent's four tools, the engine surface that serves them,
      # the served turn that indexes its skills, and their real-jail proof.
      - "tests/test_universe_tools_jail.py"
      - "tests/engine_authority_helpers.py"
      - "tinyassets/universe_tools.py"
      - "tinyassets/engine_mcp_server.py"
      - "tinyassets/served_tools.py"
      - "tinyassets/universe_intelligence.py"
      - "tinyassets/workspace_fs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-jail-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # The ONLY test files this job runs, and EVERY case it must see executed
  # (space-separated; no path or nodeid here contains a space). Kept as env so
  # the shell steps never interpolate an expression.
  JAIL_TEST_FILES: >-
    tests/test_delivery_node_rpc.py
    tests/test_native_refresh_jail.py
    tests/test_provider_universe_jail.py
    tests/test_universe_tools_jail.py
  JAIL_TEST_NODEIDS: >-
    tests/test_delivery_node_rpc.py::test_real_linux_jail_transports_delivery_rpc
    tests/test_native_refresh_jail.py::test_jail_reads_workspace_but_not_launch_credentials
    tests/test_native_refresh_jail.py::test_removing_the_launch_mask_exposes_the_snapshot
    tests/test_provider_universe_jail.py::test_claude_node_call_reads_only_its_own_universe
    tests/test_provider_universe_jail.py::test_codex_node_call_reads_only_its_own_universe
    tests/test_provider_universe_jail.py::test_router_jails_a_new_command_adapter_with_no_jail_code
    tests/test_universe_tools_jail.py::test_tools_reach_their_own_universe_and_nothing_else
    tests/test_universe_tools_jail.py::test_a_settings_dir_the_agent_writes_is_masked_from_a_provider_launch
    tests/test_universe_tools_jail.py::test_io_uring_and_symlink_are_refused_in_the_jail
    tests/test_universe_tools_jail.py::test_an_engine_pinned_to_another_universe_cannot_reach_it
    tests/test_universe_tools_jail.py::test_bash_has_no_network
    tests/test_universe_tools_jail.py::test_the_limits_are_applied_inside_the_jail
    tests/test_universe_tools_jail.py::test_memory_limit_stops_a_runaway_allocation
    tests/test_universe_tools_jail.py::test_process_limit_holds_and_a_fork_bomb_is_contained
    tests/test_universe_tools_jail.py::test_cpu_output_and_wall_clock_limits_kill
    tests/test_universe_tools_jail.py::test_a_jail_that_fills_the_shared_disk_is_killed
    tests/test_universe_tools_jail.py::test_a_skill_the_agent_writes_changes_its_next_turn

jobs:
  linux-jail-proof:
    name: linux-jail-proof
    # Ephemeral GitHub-hosted VM only. Never self-hosted, never a container
    # image (Docker's default seccomp blocks bubblewrap's clone flags, which
    # is why the local oracle has to relax seccomp — this job does not).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          command -v bwrap
          bwrap --version

      - name: Probe the jail (functional smoke)
        id: probe
        run: |
          set -euo pipefail
          # Mirrors the flags node_sandbox.BwrapLauncher actually uses:
          # --die-with-parent --new-session --unshare-all. If a jail cannot be
          # created with these, the real test cannot pass, so decide it here
          # with a clear message instead of inside pytest.
          smoke=(bwrap --die-with-parent --new-session --unshare-all
                 --ro-bind / / --proc /proc --dev /dev -- /bin/true)
          if "${smoke[@]}"; then
            echo "runner=unprivileged" >> "$GITHUB_OUTPUT"
            echo "bubblewrap jail OK without privilege"
          elif sudo -n "${smoke[@]}"; then
            # Root-approved fallback: the VM is disposable and the test is
            # hermetic. No sysctl, no AppArmor edit — just the same argv as root.
            echo "runner=sudo" >> "$GITHUB_OUTPUT"
            echo "bubblewrap jail OK only under sudo (unprivileged userns refused)"
          else
            echo "::error::bubblewrap cannot create a jail on this runner (unprivileged and sudo both failed)"
            exit 1
          fi

      - name: Run the jail proof modules inside the real jail
        env:
          # Everything the run writes lives under runner.temp, outside the
          # checkout, so tests/conftest.py's temp-root guard is satisfied and
          # no repo path is touched.
          TINYASSETS_DATA_DIR: ${{ runner.temp }}/ta-data-jail
          PYTEST_BASETEMP: ${{ runner.temp }}/ta-pt-jail
          JUNIT_PATH: ${{ runner.temp }}/junit-linux-jail.xml
          JAIL_RUNNER: ${{ steps.probe.outputs.runner }}
        run: |
          set -euo pipefail
          mkdir -p "$TINYASSETS_DATA_DIR" "$PYTEST_BASETEMP"
          # The exact interpreter setup-python put on PATH, resolved once so the
          # sudo path runs the SAME binary (and the same site-packages that
          # `pip install -e` populated), not the system python.
          py="$(command -v python)"
          "$py" --version
          read -r -a files <<< "$JAIL_TEST_FILES"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::JAIL_TEST_FILES is empty"
            exit 1
          fi
          args=("${files[@]}"
                -q -p no:cacheprovider
                -o junit_family=xunit1
                --basetemp "$PYTEST_BASETEMP"
                --junitxml "$JUNIT_PATH")
          case "$JAIL_RUNNER" in
            unprivileged)
              "$py" -m pytest "${args[@]}"
              ;;
            sudo)
              sudo -n --preserve-env=TINYASSETS_DATA_DIR,GITHUB_ACTIONS,CI,RUNNER_OS,RUNNER_TEMP \
                "$py" -m pytest "${args[@]}"
              ;;
            *)
              echo "::error::probe step produced no runner decision"
              exit 1
              ;;
          esac

      - name: Assert every real-jail case executed (a skip is not a pass)
        # Runs even when pytest is red so the summary names each case's state.
        if: always()
        env:
          JUNIT_PATH: ${{ runner.temp }}/junit-linux-jail.xml
        run: |
          set -euo pipefail
          read -r -a nodeids <<< "$JAIL_TEST_NODEIDS"
          if [ "${#nodeids[@]}" -eq 0 ]; then
            echo "::error::JAIL_TEST_NODEIDS is empty"
            exit 1
          fi
          nodeid_args=()
          for nodeid in "${nodeids[@]}"; do
            nodeid_args+=(--nodeid "$nodeid")
          done
          python scripts/ci_assert_junit_case.py \
            --junit "$JUNIT_PATH" \
            "${nodeid_args[@]}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-linux-jail-proof
          path: ${{ runner.temp }}/junit-linux-jail.xml
          if-no-files-found: warn
