# Preview-only Worker that serves the React static export and blocks /mcp.
# Deployed only by the trusted default-branch preview-worker-deploy workflow
# with the react-preview environment's dedicated preview-account credential.
# Pull-request builds cannot select or modify this trusted configuration.
name = "tiny-site-react-preview"
main = "cf-worker/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = true

[assets]
directory = "./out"
binding = "ASSETS"
# Serve out/404.html for unmatched paths so the SPA fallback (deep-linked goals) works.
not_found_handling = "404-page"
# Pull-request assets can contain an `mcp` path. Force the trusted Worker to
# intercept both the exact connector route and descendants before asset lookup.
run_worker_first = ["/mcp", "/mcp/*"]
